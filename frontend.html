<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{SONG_TITLE}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --key-w: 34px;
            --key-h: 84px;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            padding: 12px 8px 16px;
            text-align: center;
            font-family: 'Zen Kaku Gothic New', 'Noto Sans TC', sans-serif;
            color: #4A4035;
            background: linear-gradient(180deg, #F7F3EB 0%, #EDE8DF 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }
        /* PC：自然捲動，完整顯示雙排琴鍵與鍵盤提示 */
        body.profile-desktop {
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100%;
        }
        body.profile-desktop .game-shell {
            padding-bottom: 12px;
        }
        body.profile-desktop .mobile-dock { display: none !important; }
        body.profile-desktop .keyboard-hint-desktop { display: block !important; }
        body.profile-desktop .touch-hint { display: none !important; }
        body.profile-desktop .p-key .kn { font-size: 1rem; }
        /* 手機／平板橫向：緊湊全螢幕 */
        body.layout-compact {
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .game-shell {
            max-width: 1200px;
            margin: 0 auto;
        }
        body.layout-compact .game-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 100dvh;
            max-width: none;
            margin: 0;
            overflow: hidden;
        }
        body.layout-compact .game-shell > .piano-section { order: 3; }
        body.layout-compact .game-shell > .playfield { order: 2; flex: 1; }
        body.layout-compact .game-shell > .playfield-chrome { order: 1; }
        .playfield { width: 100%; }
        body.layout-compact .playfield {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            overflow: hidden;
        }
        body.layout-compact .playfield-chrome {
            flex-shrink: 0;
            width: 100%;
            padding: 2px 4px 0;
        }
        /* iPad 直向：可練習（捲動），僅 iPhone 直向鎖定 */
        body.profile-tablet.mode-port .game-shell {
            opacity: 1;
            pointer-events: auto;
        }
        .game-header { margin-bottom: 6px; }
        h3 {
            margin: 0 0 4px;
            font-family: 'Noto Serif JP', 'Noto Serif TC', serif;
            font-weight: 400;
            letter-spacing: 0.18em;
            font-size: 1.1rem;
            color: #3D3530;
        }
        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: #8B7355;
            margin-bottom: 12px;
        }
        .canvas-wrap {
            position: relative;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 1100px;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            vertical-align: top;
            background: #2C2824;
            border: 1px solid #C9B8A4;
            border-radius: 2px;
            box-shadow: 0 8px 32px rgba(74, 64, 53, 0.12);
        }
        #rotateHint {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(165deg, #2C2824, #4A4035);
            color: #F7F3EB;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px;
            font-family: 'Noto Serif JP', serif;
            letter-spacing: 0.12em;
        }
        #rotateHint.show { display: flex; }
        #rotateHint .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            animation: tiltPhone 1.2s ease-in-out infinite;
        }
        @keyframes tiltPhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        #comboOverlay {
            position: absolute;
            right: 4%;
            top: 28%;
            pointer-events: none;
            text-align: right;
            z-index: 8;
        }
        #comboAura {
            position: absolute;
            right: -8%;
            top: 50%;
            width: 140px;
            height: 140px;
            margin-top: -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 120, 40, 0.55) 0%, transparent 70%);
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.12s, transform 0.2s;
            filter: blur(8px);
        }
        #comboAura.on { opacity: 1; transform: scale(1); }
        #comboAura.heat-high {
            width: 200px;
            height: 200px;
            margin-top: -100px;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.7) 0%, rgba(255, 60, 0, 0.35) 45%, transparent 72%);
            animation: auraPulse 0.35s ease-in-out infinite;
        }
        #comboAura.heat-max {
            width: 260px;
            height: 260px;
            margin-top: -130px;
            background: radial-gradient(circle, rgba(255, 255, 200, 0.85) 0%, rgba(255, 140, 0, 0.55) 40%, rgba(255, 40, 0, 0.25) 65%, transparent 78%);
            animation: auraPulse 0.18s ease-in-out infinite;
        }
        @keyframes auraPulse {
            0%, 100% { transform: scale(1); filter: blur(8px) brightness(1); }
            50% { transform: scale(1.12); filter: blur(10px) brightness(1.35); }
        }
        #comboNumber {
            position: relative;
            font-family: 'Noto Serif JP', 'Noto Sans TC', sans-serif;
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1;
            color: #FF6D00;
            -webkit-text-stroke: 1px rgba(120, 30, 0, 0.35);
            text-shadow:
                0 0 16px rgba(255, 100, 30, 1),
                0 0 32px rgba(255, 60, 0, 0.75),
                0 3px 0 #8B2500,
                0 6px 12px rgba(0, 0, 0, 0.5);
            transform: scale(1);
            opacity: 0;
            transition: opacity 0.1s;
        }
        #comboNumber.visible { opacity: 1; }
        #comboNumber.bump {
            animation: comboBump 0.2s cubic-bezier(0.15, 1.55, 0.35, 1);
        }
        #comboNumber.mega {
            color: #FFD600;
            font-size: 4.6rem;
            text-shadow:
                0 0 24px rgba(255, 220, 0, 1),
                0 0 48px rgba(255, 120, 0, 0.85),
                0 4px 0 #B8860B,
                0 8px 16px rgba(0, 0, 0, 0.45);
        }
        #comboNumber.ultra {
            color: #FFFDE7;
            font-size: 5.4rem;
            animation: comboUltra 0.4s ease-out;
        }
        #comboNumber.fire {
            color: #FF3D00;
            font-size: 4.8rem;
            animation: comboFire 0.22s ease-in-out infinite;
            text-shadow:
                0 0 28px #FF6D00,
                0 0 56px rgba(255, 200, 0, 0.9),
                0 4px 0 #BF360C;
        }
        #comboNumber.inferno {
            color: #FFEB3B;
            font-size: 5.8rem;
            animation: comboInferno 0.16s ease-in-out infinite;
            text-shadow:
                0 0 32px #FF5722,
                0 0 64px #FFD54F,
                0 0 96px rgba(255, 80, 0, 0.65),
                0 5px 0 #E65100;
        }
        #comboNumber.godlike {
            color: #FFFFFF;
            font-size: 6.2rem;
            animation: comboGodlike 0.12s ease-in-out infinite;
            text-shadow:
                0 0 20px #FF1744,
                0 0 40px #FF9100,
                0 0 60px #FFEA00,
                0 0 80px #76FF03,
                0 5px 0 #D50000;
        }
        @keyframes comboFire {
            0%, 100% { transform: scale(1) rotate(-3deg) skewX(-2deg); }
            50% { transform: scale(1.12) rotate(3deg) skewX(2deg); }
        }
        @keyframes comboInferno {
            0% { transform: scale(1.1) rotate(-4deg); filter: brightness(1.4) hue-rotate(0deg); }
            50% { transform: scale(1.22) rotate(4deg); filter: brightness(1.7) hue-rotate(8deg); }
            100% { transform: scale(1.08) rotate(-3deg); filter: brightness(1.35) hue-rotate(-5deg); }
        }
        @keyframes comboGodlike {
            0%, 100% { transform: scale(1.15) rotate(-2deg); filter: brightness(1.5) saturate(1.4); }
            33% { transform: scale(1.28) rotate(2deg); filter: brightness(1.8) saturate(1.6) hue-rotate(15deg); }
            66% { transform: scale(1.2) rotate(-1deg); filter: brightness(1.65) saturate(1.5) hue-rotate(-10deg); }
        }
        #comboLabel {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            color: #FFB74D;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.12s;
            text-shadow: 0 0 8px rgba(255, 140, 0, 0.8);
        }
        #comboLabel.visible { opacity: 1; }
        #comboLabel.rage {
            font-size: 1.05rem;
            color: #FFEB3B;
            letter-spacing: 0.2em;
            animation: labelShake 0.15s ease-in-out infinite;
        }
        @keyframes labelShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        #comboMilestone {
            position: absolute;
            left: 50%;
            top: 22%;
            transform: translateX(-50%) scale(0.3);
            pointer-events: none;
            font-family: 'Noto Serif JP', 'Noto Sans TC', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #FFEB3B;
            opacity: 0;
            z-index: 9;
            white-space: nowrap;
            text-shadow:
                0 0 20px #FF6D00,
                0 0 40px rgba(255, 200, 0, 0.9),
                0 4px 0 #BF360C,
                3px 3px 0 rgba(0, 0, 0, 0.4);
        }
        #comboMilestone.show {
            animation: milestonePop 0.85s cubic-bezier(0.12, 1.45, 0.28, 1) forwards;
        }
        @keyframes milestonePop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.2) rotate(-8deg); }
            20% { opacity: 1; transform: translateX(-50%) scale(1.35) rotate(4deg); }
            45% { opacity: 1; transform: translateX(-50%) scale(1.1) rotate(-2deg); }
            100% { opacity: 0; transform: translateX(-50%) scale(1.25) translateY(-36px) rotate(6deg); }
        }
        #edgeGlow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            box-shadow: inset 0 0 60px rgba(255, 120, 0, 0);
            border-radius: 2px;
        }
        #edgeGlow.on {
            animation: edgeGlowFlash 0.35s ease-out forwards;
        }
        @keyframes edgeGlowFlash {
            0% { opacity: 1; box-shadow: inset 0 0 80px rgba(255, 200, 60, 0.85), inset 0 0 120px rgba(255, 80, 0, 0.45); }
            100% { opacity: 0; box-shadow: inset 0 0 20px rgba(255, 120, 0, 0); }
        }
        #judgmentPop {
            position: absolute;
            left: 50%;
            top: 54%;
            transform: translate(-50%, -50%) scale(0.3);
            pointer-events: none;
            font-family: 'Noto Serif JP', 'Noto Sans TC', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            opacity: 0;
            z-index: 6;
            white-space: nowrap;
        }
        #judgmentPop.show {
            animation: judgmentPop 0.5s cubic-bezier(0.12, 1.35, 0.25, 1) forwards;
        }
        #judgmentPop.good {
            color: #B9F6CA;
            text-shadow: 0 0 14px rgba(129, 199, 132, 0.95), 0 2px 0 #2E7D32;
        }
        #rapidBanner {
            position: absolute;
            left: 50%;
            top: 14%;
            transform: translateX(-50%) scale(0.35);
            pointer-events: none;
            font-family: 'Noto Serif JP', 'Noto Sans TC', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: #FF1744;
            letter-spacing: 0.04em;
            opacity: 0;
            z-index: 7;
            white-space: nowrap;
            -webkit-text-stroke: 1px rgba(100, 0, 0, 0.4);
            text-shadow:
                0 0 24px #FF6D00,
                0 0 48px rgba(255, 230, 0, 1),
                0 0 72px rgba(255, 60, 0, 0.6),
                0 4px 0 #B71C1C,
                3px 3px 0 rgba(0, 0, 0, 0.35);
        }
        #rapidBanner.show {
            animation: rapidBanner 0.75s cubic-bezier(0.1, 1.5, 0.22, 1) forwards;
        }
        #judgmentPop.perfect {
            color: #FFEB3B;
            font-size: 3.4rem;
            text-shadow:
                0 0 24px #FF9800,
                0 0 48px rgba(255, 235, 59, 1),
                0 0 72px rgba(255, 120, 0, 0.7),
                0 3px 0 #E65100,
                0 6px 0 rgba(0, 0, 0, 0.25);
        }
        #screenFlash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.35) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            border-radius: 2px;
        }
        #screenFlash.on {
            animation: screenFlash 0.25s ease-out forwards;
        }
        @keyframes comboBump {
            0% { transform: scale(2.2) rotate(-4deg); }
            55% { transform: scale(0.92) rotate(2deg); }
            100% { transform: scale(1) rotate(0); }
        }
        @keyframes comboUltra {
            0% { transform: scale(2.8); filter: brightness(2); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        @keyframes judgmentPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            35% { opacity: 1; transform: translate(-50%, -58%) scale(1.35); }
            70% { opacity: 1; transform: translate(-50%, -62%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -72%) scale(0.85); }
        }
        @keyframes rapidBanner {
            0% { opacity: 0; transform: translateX(-50%) scale(0.25) rotate(-14deg); }
            15% { opacity: 1; transform: translateX(-50%) scale(1.55) rotate(5deg); }
            35% { opacity: 1; transform: translateX(-50%) scale(1.25) rotate(-3deg); }
            55% { opacity: 1; transform: translateX(-50%) scale(1.35) rotate(2deg); }
            100% { opacity: 0; transform: translateX(-50%) scale(1.4) translateY(-42px) rotate(8deg); }
        }
        @keyframes screenFlash {
            0% { opacity: 0.7; }
            100% { opacity: 0; }
        }
        #statCombo.hot { color: #E85D3A; font-weight: 600; }
        .stats-bar {
            display: flex; justify-content: center; gap: 24px;
            margin: 10px 0; font-size: 0.85rem;
            color: #6B5E52; letter-spacing: 0.06em;
        }
        .controls {
            margin-top: 12px;
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px; align-items: center;
        }
        button, select, input[type="number"] {
            font-family: inherit;
            padding: 8px 14px;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            border-radius: 2px;
            border: 1px solid #C9B8A4;
            background: #F7F3EB;
            color: #4A4035;
        }
        button.primary {
            background: #8B7355;
            color: #F7F3EB;
            border-color: #8B7355;
        }
        button.active-mode {
            background: #A8B5A0;
            color: #2C3828;
            border-color: #8A9A86;
        }
        button.secondary { background: #EFEBE3; }
        .keyboard-hint {
            margin-top: 10px;
            font-size: 0.72rem;
            color: #8B7355;
            letter-spacing: 0.08em;
            line-height: 1.6;
        }
        .octave-label {
            margin: 12px 0 4px;
            font-size: 0.68rem;
            color: #A89888;
            letter-spacing: 0.2em;
            font-family: 'Noto Serif JP', serif;
        }
        .piano-wrap {
            display: flex; justify-content: center;
            gap: 2px; overflow-x: auto; padding-bottom: 4px;
            touch-action: none;
        }
        .piano-section { width: 100%; max-width: 1100px; margin: 0 auto; }
        .piano-section .piano-rows {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }
        .piano-section .piano-wrap {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            width: 100%;
        }
        .p-key {
            width: var(--key-w);
            min-width: var(--key-w);
            height: var(--key-h);
            background: #FAF8F4;
            color: #4A4035;
            border: 1px solid #D4C9B8;
            border-radius: 0 0 4px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 6px;
            font-size: 0.65rem;
            transition: background 0.08s, transform 0.06s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
        .touch-hint { display: none; margin-top: 8px; }
        .touch-device .keyboard-hint-desktop { display: none; }
        .touch-device .touch-hint { display: block; }
        /* 手機／平板橫向緊湊模式：由 JS 加 layout-compact */
        body.layout-compact .game-header {
            margin: 0;
            padding: 2px 0;
        }
        body.layout-compact .game-header h3 {
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            margin: 0;
        }
        body.layout-compact .game-header .subtitle { display: none; }
        body.layout-compact .stats-bar {
            font-size: 0.65rem;
            gap: 10px;
            margin: 2px 0;
        }
        body.layout-compact .controls {
            gap: 4px;
            margin: 2px 0 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        body.layout-compact .controls button,
        body.layout-compact .controls select {
            min-height: 36px;
            padding: 4px 8px;
            font-size: 0.7rem;
        }
        body.layout-compact .controls label { font-size: 0.65rem; }
        body.layout-compact .controls input[type="number"] {
            width: 44px !important;
            font-size: 0.7rem;
        }
        body.layout-compact .ctrl-ab { display: none !important; }
        body.layout-compact .playfield-chrome .controls { display: none !important; }
        body.layout-compact .keyboard-hint { display: none !important; }
        body.layout-compact .p-key .kn {
            display: block;
            font-size: 0.62rem;
            line-height: 1;
        }
        body.layout-compact .p-key span:not(.kn) { font-size: 0.5rem; opacity: 0.9; }
        .mobile-dock {
            display: none;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 6px 8px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            background: rgba(247, 243, 235, 0.97);
            border-top: 1px solid #D4C9B8;
            z-index: 30;
        }
        body.layout-compact .mobile-dock { display: flex; }
        .mobile-dock .dock-btn {
            min-height: 48px;
            padding: 0 16px;
            border-radius: 4px;
            border: 1px solid #C9B8A4;
            background: #F7F3EB;
            color: #4A4035;
            font-size: 0.95rem;
            font-family: inherit;
            letter-spacing: 0.06em;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-dock .dock-btn.primary {
            min-width: 132px;
            background: #8B7355;
            color: #F7F3EB;
            border: none;
            font-weight: 600;
        }
        .mobile-dock .dock-btn.active-mode {
            background: #6B5742;
        }
        .mobile-dock .dock-speed {
            min-height: 44px;
            font-size: 0.8rem;
            border: 1px solid #C9B8A4;
            border-radius: 4px;
            background: #F7F3EB;
        }
        #countdownOverlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(20, 18, 16, 0.72);
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        #countdownOverlay.show { display: flex; }
        #countdownNum {
            font-family: 'Noto Serif JP', serif;
            font-size: 4.5rem;
            color: #FFD54F;
            text-shadow: 0 0 24px rgba(255, 213, 100, 0.6);
        }
        body.layout-compact .canvas-wrap {
            flex: 0 0 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin: 0;
            max-width: none;
        }
        body.layout-compact #gameCanvas {
            width: auto !important;
            max-width: 100%;
            height: auto !important;
            flex-shrink: 0;
        }
        body.layout-compact .octave-label {
            display: block;
            margin: 0;
            font-size: 0.5rem;
            letter-spacing: 0.12em;
        }
        body.profile-tablet.layout-compact .p-key {
            min-height: 48px;
        }
        body.layout-compact .piano-section {
            flex-shrink: 0;
            width: 100%;
            margin: 0;
            padding: 2px 0 max(4px, env(safe-area-inset-bottom));
            max-width: none;
            min-height: calc(var(--key-h) * 2 + 32px);
            position: relative;
            z-index: 20;
            background: linear-gradient(180deg, transparent 0%, rgba(247, 243, 235, 0.98) 12%);
        }
        body.layout-compact .piano-section .piano-rows {
            flex-direction: column;
            gap: 4px;
        }
        body.layout-compact .piano-section .piano-wrap {
            overflow: visible;
            padding-bottom: 0;
        }
        body.layout-compact .p-key {
            min-height: 44px;
            padding-bottom: 4px;
            font-size: 0.55rem;
        }
        body.layout-compact .p-key .kn { font-size: 0.85rem; }
        body.layout-compact #comboNumber { font-size: 1.8rem; }
        body.layout-compact #comboNumber.mega { font-size: 2.2rem; }
        body.layout-compact #judgmentPop { font-size: 1.35rem; }
        /* 僅 iPhone 直向：提示橫放 */
        body.profile-phone.mode-port .game-shell {
            opacity: 0.35;
            pointer-events: none;
        }

    <script>
        const rawScoreData = {{SCORE_JSON_PLACEHOLDER}};
        const AUDIO_SRC = "{{AUDIO_SRC_PLACEHOLDER}}";
        const CHORUS_START = {{CHORUS_START}};
        const CHORUS_END = {{CHORUS_END}};
        const AUDIO_OFFSET = {{AUDIO_OFFSET}};
        const PRACTICE_MODE = "{{PRACTICE_MODE}}";
        const AUTO_PLAY_ON_LOAD = {{AUTO_PLAY}};

        const PITCH_MAP = [
            { pitch: 60, key: 'a', label: 'C4', kn: 'A', octave: 1 },
            { pitch: 62, key: 's', label: 'D4', kn: 'S', octave: 1 },
            { pitch: 64, key: 'd', label: 'E4', kn: 'D', octave: 1 },
            { pitch: 65, key: 'f', label: 'F4', kn: 'F', octave: 1 },
            { pitch: 67, key: 'g', label: 'G4', kn: 'G', octave: 1 },
            { pitch: 69, key: 'h', label: 'A4', kn: 'H', octave: 1 },
            { pitch: 71, key: 'j', label: 'B4', kn: 'J', octave: 1 },
            { pitch: 72, key: 'q', label: 'C5', kn: 'Q', octave: 2 },
            { pitch: 74, key: 'w', label: 'D5', kn: 'W', octave: 2 },
            { pitch: 76, key: 'e', label: 'E5', kn: 'E', octave: 2 },
            { pitch: 77, key: 'r', label: 'F5', kn: 'R', octave: 2 },
            { pitch: 79, key: 't', label: 'G5', kn: 'T', octave: 2 },
            { pitch: 81, key: 'y', label: 'A5', kn: 'Y', octave: 2 },
            { pitch: 83, key: 'u', label: 'B5', kn: 'U', octave: 2 },
        ];
        const PITCH_MIN = 60, PITCH_MAX = 83;
        const pitchToKey = Object.fromEntries(PITCH_MAP.map(p => [p.pitch, p]));
        const keyToPitch = Object.fromEntries(PITCH_MAP.map(p => [p.key, p.pitch]));

        function initNotes(data) {
            const arr = JSON.parse(JSON.stringify(data || []));
            arr.forEach(n => {
                n.isHit = false;
                n.isMissed = false;
                const pk = pitchToKey[n.pitch];
                n.keyHint = pk ? pk.kn : '?';
                n.playable = !!pk;
            });
            return arr;
        }

        let notes = initNotes(rawScoreData);
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgm');
        if (AUDIO_SRC) audio.src = AUDIO_SRC;

        const PIXELS_PER_SECOND = 125;
        const PERFECT_WINDOW = 0.06;
        const HIT_WINDOW = 0.2;
        const ELIMINATE_MS = 380;
        let layout = {
            canvasW: 1100, canvasH: 420,
            keyWidth: 34, canvasLeft: 48,
            pianoTop: 366, judgeY: 362,
        };

        let deviceProfile = 'desktop';

        function isTouchDevice() {
            return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        }
        function isIPadLike() {
            const ua = navigator.userAgent || '';
            return /iPad/i.test(ua)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }
        /** desktop | tablet | phone */
        function detectDeviceProfile() {
            const short = Math.min(window.innerWidth, window.innerHeight);
            const long = Math.max(window.innerWidth, window.innerHeight);
            const finePointer = window.matchMedia('(pointer: fine)').matches;
            if (!isTouchDevice() || (finePointer && !isIPadLike() && short >= 520)) {
                return 'desktop';
            }
            if (isIPadLike()) return 'tablet';
            if (short >= 600 || (long >= 900 && short >= 500)) return 'tablet';
            return 'phone';
        }
        function isTouchProfile() {
            return deviceProfile === 'tablet' || deviceProfile === 'phone';
        }
        /** 以實際寬高判斷橫向（支援倒掛 landscape-secondary） */
        function isLandscapeView() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w > h) return true;
            const o = screen.orientation;
            if (o && typeof o.angle === 'number') {
                const a = ((o.angle % 360) + 360) % 360;
                return a === 90 || a === 270;
            }
            if (typeof window.orientation === 'number') {
                return Math.abs(window.orientation) === 90;
            }
            return false;
        }
        function noteW() { return layout.keyWidth - 5; }

        function viewportHeight() {
            return window.visualViewport ? window.visualViewport.height : window.innerHeight;
        }

        function chromeSelectors() {
            if (deviceProfile === 'desktop') {
                return '.playfield-chrome, .piano-section, .keyboard-hint';
            }
            if (document.body.classList.contains('layout-compact')) {
                return '.playfield-chrome, .mobile-dock, .piano-section';
            }
            return '.playfield-chrome, .piano-section, .keyboard-hint';
        }

        function measureChromeHeight() {
            let total = 0;
            document.querySelectorAll(chromeSelectors()).forEach(el => {
                if (!el || el.offsetParent === null) return;
                const st = getComputedStyle(el);
                if (st.display === 'none' || st.visibility === 'hidden') return;
                total += el.getBoundingClientRect().height;
            });
            return Math.ceil(total) + 4;
        }

        function applyProfileClasses() {
            const profile = detectDeviceProfile();
            const land = isLandscapeView();
            document.body.classList.remove(
                'profile-desktop', 'profile-tablet', 'profile-phone',
                'layout-compact', 'mode-land', 'mode-port',
                'touch-device', 'touch-play'
            );
            document.body.classList.add('profile-' + profile);
            document.body.classList.toggle('mode-land', land);
            document.body.classList.toggle('mode-port', !land);
            if (profile !== 'desktop') {
                document.body.classList.add('touch-device');
            }
            if (profile !== 'desktop' && land) {
                document.body.classList.add('layout-compact', 'touch-play');
            }
            deviceProfile = profile;
            return { profile, land };
        }

        function minKeyWidth() {
            if (deviceProfile === 'desktop') return 30;
            if (deviceProfile === 'tablet') return 24;
            return 20;
        }

        function refineCanvasHeight(maxRatio) {
            requestAnimationFrame(() => {
                const vh = viewportHeight();
                const ch = measureChromeHeight();
                const maxH = Math.round(layout.canvasW * maxRatio);
                const h2 = Math.max(120, Math.min(Math.floor(vh - ch - 8), maxH));
                if (Math.abs(h2 - layout.canvasH) <= 4) return;
                layout.canvasH = h2;
                layout.pianoTop = h2 - 4;
                layout.judgeY = layout.pianoTop - 4;
                canvas.height = h2;
                canvas.style.height = h2 + 'px';
            });
        }

        function syncPianoToCanvas(w, keyW, left) {
            const rows = document.getElementById('pianoRows');
            const low = document.getElementById('piano-low');
            const high = document.getElementById('piano-high');
            const rowW = keyW * 7;
            const band = keyW * 14;
            if (rows) {
                rows.style.width = rowW + 'px';
                rows.style.maxWidth = '100%';
                rows.style.marginLeft = 'auto';
                rows.style.marginRight = 'auto';
            }
            if (low) low.style.width = rowW + 'px';
            if (high) high.style.width = rowW + 'px';
            const sec = document.querySelector('.piano-section');
            if (sec) {
                sec.style.width = '100%';
                sec.style.maxWidth = w + 'px';
                sec.style.marginLeft = 'auto';
                sec.style.marginRight = 'auto';
                sec.style.paddingLeft = '0';
            }
            const cwrap = document.querySelector('.canvas-wrap');
            if (cwrap) {
                cwrap.style.maxWidth = w + 'px';
            }
        }

        function applyLayout() {
            const wrap = document.querySelector('.canvas-wrap');
            const availW = wrap ? Math.max(280, wrap.clientWidth) : Math.min(1100, window.innerWidth - 16);
            const { profile, land } = applyProfileClasses();
            const viewH = viewportHeight();
            let w, h, keyW, keyH;
            const pad = profile === 'desktop' ? 56 : 8;

            if (profile === 'desktop') {
                document.documentElement.style.height = '';
                document.body.style.height = '';
                keyW = Math.max(minKeyWidth(), Math.floor((Math.min(1100, availW) - pad) / 14));
                w = keyW * 14 + pad;
                keyH = Math.min(92, Math.max(76, Math.round(keyW * 2.35)));
                document.documentElement.style.setProperty('--key-w', keyW + 'px');
                document.documentElement.style.setProperty('--key-h', keyH + 'px');
                h = Math.max(200, Math.min(Math.floor(viewH - measureChromeHeight() - 12), Math.round(w * 0.46)));
            } else if (profile === 'phone' && !land) {
                document.documentElement.style.height = '';
                document.body.style.height = '';
                keyW = Math.max(minKeyWidth(), Math.floor((Math.min(availW, 900) - 28) / 14));
                w = keyW * 14 + 28;
                keyH = 64;
                h = Math.floor(Math.max(140, Math.min(w * 0.34, 280)));
                document.documentElement.style.setProperty('--key-w', keyW + 'px');
                document.documentElement.style.setProperty('--key-h', keyH + 'px');
            } else if (land) {
                document.documentElement.style.height = viewH + 'px';
                document.body.style.height = viewH + 'px';
                const viewW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
                keyW = Math.max(minKeyWidth(), Math.floor((Math.min(viewW - 8, availW) - 8) / 14));
                w = keyW * 14 + 8;
                keyH = profile === 'tablet'
                    ? Math.min(58, Math.max(44, Math.floor(viewH * 0.115)))
                    : Math.min(48, Math.max(36, Math.floor(viewH * 0.10)));
                document.documentElement.style.setProperty('--key-h', Math.round(keyH) + 'px');
                document.documentElement.style.setProperty('--key-w', keyW + 'px');
                h = Math.max(100, Math.min(Math.floor(viewH - measureChromeHeight() - 6), profile === 'tablet' ? 400 : 340));
            } else {
                document.documentElement.style.height = '';
                document.body.style.height = '';
                keyW = Math.max(minKeyWidth(), Math.floor((Math.min(availW, 1000) - 32) / 14));
                w = keyW * 14 + 32;
                keyH = 66;
                document.documentElement.style.setProperty('--key-w', keyW + 'px');
                document.documentElement.style.setProperty('--key-h', keyH + 'px');
                h = Math.max(160, Math.min(Math.floor(viewH - measureChromeHeight() - 12), 340));
            }

            const left = Math.max(4, Math.floor((w - keyW * 14) / 2));
            const compactLand = profile !== 'desktop' && land;
            const pianoTop = compactLand
                ? h - 4
                : h - Math.max(44, Math.round(h * 0.128));
            layout = {
                canvasW: w, canvasH: h,
                keyWidth: keyW, canvasLeft: left,
                pianoTop, judgeY: pianoTop - 4,
            };

            canvas.width = w;
            canvas.height = h;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            syncPianoToCanvas(w, keyW, left);

            document.body.classList.toggle('layout-landscape', land);
            document.body.classList.toggle('layout-portrait', !land);

            const rh = document.getElementById('rotateHint');
            if (rh) rh.classList.toggle('show', profile === 'phone' && !land);

            if (profile === 'desktop') {
                refineCanvasHeight(0.48);
            } else if (land) {
                refineCanvasHeight(profile === 'tablet' ? 0.42 : 0.38);
            } else if (profile === 'tablet') {
                refineCanvasHeight(0.36);
            }
        }
        const RAPID_WINDOW_MS = 520;

        let animationId = null;
        let stats = { hits: 0, mistakes: 0, combo: 0, maxCombo: 0 };
        let feedbackText = '', feedbackColor = '#E8DED0', feedbackTimer = 0;
        let teachMode = false, autoPlayMode = false;
        let teachTimeouts = [], autoTimeouts = [];
        let loopEnabled = PRACTICE_MODE === 'chorus';
        let useInternalClock = !AUDIO_SRC;
        let clockStart = 0, clockPausedAt = 0, isPlaying = false;
        let screenShake = 0;
        let particles = [];
        let hitRings = [];
        let hitBursts = [];
        let recentHitTimes = [];
        let lastRapidBannerAt = 0;

        const comboEl = document.getElementById('comboNumber');
        const comboLabelEl = document.getElementById('comboLabel');
        const comboAuraEl = document.getElementById('comboAura');
        const comboMilestoneEl = document.getElementById('comboMilestone');
        const judgmentEl = document.getElementById('judgmentPop');
        const rapidBannerEl = document.getElementById('rapidBanner');
        const screenFlashEl = document.getElementById('screenFlash');
        const edgeGlowEl = document.getElementById('edgeGlow');
        const statComboEl = document.getElementById('statCombo');
        let comboHeat = 0;
        let lastMilestoneCombo = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const keyEls = {};

        document.getElementById('modeLabel').textContent =
            PRACTICE_MODE === 'chorus' ? '副歌練習 · サビ' : '整首練習 · フル';

        const pianoLow = document.getElementById('piano-low');
        const pianoHigh = document.getElementById('piano-high');
        function bindPianoKey(el, key) {
            let lastFire = 0;
            const tap = (e) => {
                if (e.pointerType === 'mouse' && e.buttons !== 1 && e.type === 'pointerdown') return;
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                const now = performance.now();
                if (now - lastFire < 70) return;
                lastFire = now;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                onKeyPress(key);
            };
            el.addEventListener('pointerdown', tap);
            el.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        PITCH_MAP.forEach(p => {
            const el = document.createElement('div');
            el.className = 'p-key';
            el.id = 'pk-' + p.key;
            el.innerHTML = `<span class="kn">${p.kn}</span><span>${p.label}</span>`;
            bindPianoKey(el, p.key);
            (p.octave === 1 ? pianoLow : pianoHigh).appendChild(el);
            keyEls[p.key] = el;
        });

        applyProfileClasses();

        const btnPlayDock = document.getElementById('btnPlayDock');
        if (btnPlayDock) {
            btnPlayDock.addEventListener('click', (e) => {
                e.preventDefault();
                togglePlay();
            });
        }
        const speedSelDock = document.getElementById('speedSelDock');
        if (speedSelDock) {
            speedSelDock.addEventListener('change', () => setSpeedFrom(speedSelDock));
        }
        const btnRestartDock = document.getElementById('btnRestartDock');
        if (btnRestartDock) {
            btnRestartDock.addEventListener('click', (e) => {
                e.preventDefault();
                restart();
            });
        }

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function playSynth(midi, dur = 0.35) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = midiToFreq(midi);
            gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function highlightKey(key, cls) {
            const el = keyEls[key];
            if (!el) return;
            el.classList.remove('active', 'teach', 'auto');
            if (cls) el.classList.add(cls);
        }

        function clearKeyHighlights() {
            Object.values(keyEls).forEach(el => el.classList.remove('active', 'teach', 'auto'));
        }

        function getSpeed() {
            return parseFloat(document.getElementById('speedSel').value);
        }

        function getCurrentTime() {
            if (useInternalClock) {
                if (!isPlaying) return clockPausedAt;
                return clockPausedAt + (performance.now() - clockStart) / 1000 * getSpeed();
            }
            return audio.currentTime - AUDIO_OFFSET;
        }

        function getNoteX(pitch) {
            const idx = PITCH_MAP.findIndex(p => p.pitch === pitch);
            if (idx >= 0) return layout.canvasLeft + idx * layout.keyWidth;
            const clamped = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
            return layout.canvasLeft + (clamped - PITCH_MIN) * (layout.keyWidth * 0.58);
        }

        function updateStatsUI() {
            const total = stats.hits + stats.mistakes;
            const acc = total ? Math.round((stats.hits / total) * 100) : 100;
            statComboEl.textContent = '連擊 ' + stats.combo;
            statComboEl.classList.toggle('hot', stats.combo >= 10);
            document.getElementById('statAcc').textContent = '正確率 ' + acc + '%';
            document.getElementById('statMiss').textContent = '漏接 ' + stats.mistakes;
        }

        function showFeedback(text, color) {
            feedbackText = text;
            feedbackColor = color;
            feedbackTimer = 35;
        }

        function getNoteCenterX(pitch) {
            return getNoteX(pitch) + noteW() / 2;
        }

        function spawnParticles(cx, cy, perfect, count) {
            const heat = comboHeat;
            const n = count || (perfect ? 22 + Math.min(heat, 20) : 14 + Math.min(heat, 10));
            const baseHue = perfect
                ? (heat >= 30 ? 8 + Math.random() * 50 : 42)
                : 18;
            for (let i = 0; i < n; i++) {
                const angle = (Math.PI * 2 * i) / n + Math.random() * 0.5;
                const speed = (perfect ? 5 + heat * 0.08 : 3.2) + Math.random() * 4;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - (1.4 + heat * 0.02),
                    life: 1,
                    decay: 0.024 + Math.random() * 0.018,
                    size: (perfect ? 5 : 3) + Math.random() * (4 + heat * 0.08),
                    hue: baseHue + Math.random() * 28,
                });
            }
            if (heat >= 15 && perfect) {
                for (let j = 0; j < 8; j++) {
                    particles.push({
                        x: cx + (Math.random() - 0.5) * 40,
                        y: cy,
                        vx: (Math.random() - 0.5) * 6,
                        vy: -4 - Math.random() * 5,
                        life: 1,
                        decay: 0.02,
                        size: 2 + Math.random() * 3,
                        hue: 45 + Math.random() * 15,
                    });
                }
            }
        }

        function spawnHitRing(cx, cy, perfect, combo) {
            const boost = Math.min((combo || 1) * 0.04, 0.35);
            hitRings.push({
                x: cx, y: cy,
                radius: perfect ? 8 : 6,
                maxRadius: (perfect ? 52 : 38) * (1 + boost),
                life: 1,
                perfect,
            });
        }

        function spawnHitBurst(cx, cy, combo) {
            if (combo < 2) return;
            let text = '+';
            let color = '#FFE082';
            if (combo >= 30) {
                text = '無雙 ' + combo;
                color = '#FFEB3B';
            } else if (combo >= 20) {
                text = combo + ' 連擊!!';
                color = '#FFEB3B';
            } else if (combo >= 10) {
                text = combo + ' COMBO';
                color = '#FFAB40';
            } else if (combo >= 5) {
                text = combo + ' 連!';
                color = '#FF8A65';
            }
            hitBursts.push({
                x: cx, y: cy - 24,
                text, color,
                life: 1,
                vy: -2.8,
                scale: 1 + Math.min(combo, 40) * 0.015,
            });
        }

        function flashScreen(intensity) {
            screenFlashEl.style.opacity = String(intensity || 0.5);
            screenFlashEl.classList.remove('on');
            void screenFlashEl.offsetWidth;
            screenFlashEl.classList.add('on');
        }

        function flashEdge() {
            if (!edgeGlowEl) return;
            edgeGlowEl.classList.remove('on');
            void edgeGlowEl.offsetWidth;
            edgeGlowEl.classList.add('on');
        }

        function showMilestone(text) {
            if (!comboMilestoneEl) return;
            comboMilestoneEl.textContent = text;
            comboMilestoneEl.classList.remove('show');
            void comboMilestoneEl.offsetWidth;
            comboMilestoneEl.classList.add('show');
            flashEdge();
            flashScreen(0.75);
            screenShake = Math.max(screenShake, 16);
        }

        function checkComboMilestone(combo) {
            const marks = [5, 10, 20, 30, 50, 100];
            for (const m of marks) {
                if (combo >= m && lastMilestoneCombo < m) {
                    lastMilestoneCombo = m;
                    const msg =
                        m >= 100 ? '100 連擊！！神！' :
                        m >= 50 ? '50 連擊！！無雙！' :
                        m >= 30 ? '30 連擊！！熱血！' :
                        m >= 20 ? '20 連擊！！' :
                        m >= 10 ? '10 COMBO！' :
                        '火力全開！';
                    showMilestone(msg);
                    return;
                }
            }
        }

        function showJudgment(kind) {
            const heat = comboHeat;
            let text = '不可';
            if (kind === 'perfect') {
                text = heat >= 20 ? '完美！！' : heat >= 10 ? '完美！' : '完美';
            } else if (kind === 'good') {
                text = heat >= 15 ? '好棒！' : '好';
            }
            judgmentEl.textContent = text;
            judgmentEl.className = kind === 'perfect' ? 'perfect' : kind === 'good' ? 'good' : '';
            judgmentEl.classList.remove('show');
            void judgmentEl.offsetWidth;
            judgmentEl.classList.add('show');
        }

        function showRapidBanner(count) {
            const now = performance.now();
            if (now - lastRapidBannerAt < 280) return;
            lastRapidBannerAt = now;
            rapidBannerEl.textContent = count >= 5 ? '神速 ' + count + ' 連！！' : count + ' 連擊！！';
            rapidBannerEl.classList.remove('show');
            void rapidBannerEl.offsetWidth;
            rapidBannerEl.classList.add('show');
            flashScreen(Math.min(0.45 + count * 0.06, 0.9));
            flashEdge();
            screenShake = Math.min(10 + count * 2.2, 22);
        }

        function updateComboDisplay(combo) {
            comboHeat = combo;
            if (comboAuraEl) {
                comboAuraEl.classList.toggle('on', combo >= 3);
                comboAuraEl.classList.toggle('heat-high', combo >= 15);
                comboAuraEl.classList.toggle('heat-max', combo >= 30);
            }
            if (combo < 2) {
                comboEl.classList.remove('visible', 'bump', 'mega', 'ultra', 'fire', 'inferno', 'godlike');
                comboLabelEl.classList.remove('visible', 'rage');
                return;
            }
            comboEl.textContent = combo;
            comboEl.classList.add('visible');
            comboLabelEl.classList.add('visible');
            comboLabelEl.classList.toggle('rage', combo >= 20);
            comboLabelEl.textContent =
                combo >= 50 ? '超神連擊' :
                combo >= 30 ? '無雙模式' :
                combo >= 20 ? '熱血全開' :
                combo >= 10 ? '連擊加速' :
                combo >= 5 ? 'COMBO' : 'COMBO';

            comboEl.classList.remove('bump', 'mega', 'ultra', 'fire', 'inferno', 'godlike');
            void comboEl.offsetWidth;
            comboEl.classList.add('bump');
            if (combo >= 50) comboEl.classList.add('ultra', 'inferno', 'godlike');
            else if (combo >= 30) comboEl.classList.add('inferno', 'fire');
            else if (combo >= 20) comboEl.classList.add('mega', 'fire');
            else if (combo >= 15) comboEl.classList.add('fire');
            else if (combo >= 10) comboEl.classList.add('mega');
        }

        function resetFx() {
            particles = [];
            hitRings = [];
            hitBursts = [];
            recentHitTimes = [];
            screenShake = 0;
            comboHeat = 0;
            lastMilestoneCombo = 0;
            comboEl.classList.remove('visible', 'bump', 'mega', 'ultra', 'fire', 'inferno', 'godlike');
            comboLabelEl.classList.remove('visible', 'rage');
            if (comboAuraEl) comboAuraEl.classList.remove('on', 'heat-high', 'heat-max');
            judgmentEl.classList.remove('show');
            rapidBannerEl.classList.remove('show');
            if (comboMilestoneEl) comboMilestoneEl.classList.remove('show');
        }

        function registerHit(note, delta) {
            const perfect = delta <= PERFECT_WINDOW;
            const cx = getNoteCenterX(note.pitch);
            const now = performance.now();

            note.isHit = true;
            note.eliminateAt = now;
            note.hitPerfect = perfect;

            stats.hits++;
            stats.combo++;
            if (stats.combo > stats.maxCombo) stats.maxCombo = stats.combo;

            const comboNow = stats.combo;
            const particleN = perfect
                ? 20 + Math.min(comboNow * 2, 40)
                : 14 + Math.min(comboNow, 18);
            spawnParticles(cx, layout.judgeY, perfect, particleN);
            spawnHitRing(cx, layout.judgeY, perfect, comboNow);
            spawnHitBurst(cx, layout.judgeY, comboNow);
            showJudgment(perfect ? 'perfect' : 'good');
            updateComboDisplay(comboNow);
            checkComboMilestone(comboNow);

            const shake = (perfect ? 5 : 2.5) + Math.min(comboNow * 0.55, 18);
            screenShake = Math.max(screenShake, shake);
            const flashAmt = 0.22 + Math.min(comboNow * 0.022, 0.45);
            flashScreen(flashAmt);
            if (comboNow >= 10) flashEdge();

            if (comboNow % 10 === 0 && comboNow >= 10) {
                flashScreen(0.8);
                screenShake = Math.max(screenShake, 18);
                showFeedback(comboNow + ' 連擊！！', '#FFEB3B');
                spawnParticles(cx, layout.judgeY, true, 48);
            } else if (comboNow % 5 === 0 && comboNow >= 5) {
                flashScreen(0.55);
                flashEdge();
                showFeedback('火力全開！', '#FFAB40');
            }

            recentHitTimes.push(now);
            recentHitTimes = recentHitTimes.filter(t => now - t < RAPID_WINDOW_MS);
            if (recentHitTimes.length >= 3) {
                showRapidBanner(recentHitTimes.length);
            }
        }

        function registerMiss(note) {
            note.isMissed = true;
            note.missAt = performance.now();
            stats.mistakes++;
            stats.combo = 0;
            recentHitTimes = [];
            lastMilestoneCombo = 0;
            updateComboDisplay(0);
            showJudgment('miss');
            showFeedback('漏接', '#A08078');
            updateStatsUI();
        }

        function onKeyPress(key) {
            const pitch = keyToPitch[key];
            if (!pitch) return;
            highlightKey(key, 'active');
            playSynth(pitch, 0.25);
            setTimeout(() => highlightKey(key, null), 100);
            if (teachMode || autoPlayMode || !isPlaying) return;

            const t = getCurrentTime();
            const candidates = notes.filter(n =>
                n.pitch === pitch && !n.isHit && !n.isMissed && n.playable &&
                Math.abs(n.start_time - t) <= HIT_WINDOW
            );
            if (!candidates.length) {
                stats.combo = 0;
                updateComboDisplay(0);
                updateStatsUI();
                return;
            }
            const hit = candidates.reduce((best, n) =>
                Math.abs(n.start_time - t) < Math.abs(best.start_time - t) ? n : best
            );
            const delta = Math.abs(hit.start_time - t);
            registerHit(hit, delta);
            updateStatsUI();
        }

        window.addEventListener('keydown', e => {
            if (e.repeat) return;
            const k = e.key.toLowerCase();
            if (!keyToPitch[k]) return;
            if (deviceProfile === 'phone' && isLandscapeView() && window.innerWidth < 900) {
                return;
            }
            e.preventDefault();
            onKeyPress(k);
        });

        function drawJudgeLine() {
            const heat = comboHeat;
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / (heat >= 20 ? 120 : 280));
            const heatBoost = Math.min(heat * 0.012, 0.45);
            const grad = ctx.createLinearGradient(0, layout.judgeY - 24, 0, layout.judgeY + 24);
            grad.addColorStop(0, 'rgba(255, 120, 40, 0)');
            grad.addColorStop(0.5, `rgba(255, ${160 + heat * 2}, ${80 + heat}, ${0.28 + pulse * 0.2 + heatBoost})`);
            grad.addColorStop(1, 'rgba(255, 120, 40, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, layout.judgeY - 22, canvas.width, 44);

            const lineW = heat >= 30 ? 5 : heat >= 15 ? 4 : 3;
            ctx.strokeStyle = heat >= 20
                ? `rgba(255, ${200 + pulse * 40}, 80, ${0.75 + pulse * 0.2})`
                : `rgba(255, 213, 140, ${0.55 + pulse * 0.25 + heatBoost})`;
            ctx.lineWidth = lineW;
            ctx.beginPath();
            ctx.moveTo(layout.canvasLeft, layout.judgeY);
            ctx.lineTo(layout.canvasLeft + PITCH_MAP.length * layout.keyWidth, layout.judgeY);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(layout.canvasLeft, layout.judgeY + 2);
            ctx.lineTo(layout.canvasLeft + PITCH_MAP.length * layout.keyWidth, layout.judgeY + 2);
            ctx.stroke();
        }

        function drawNoteBlock(x, y, w, h, note, alpha, scale, nearJudge) {
            const cx = x + w / 2;
            const cy = y + h / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.translate(-cx, -cy);
            ctx.globalAlpha = alpha;

            if (note.isMissed) {
                ctx.fillStyle = 'rgba(90, 82, 78, 0.45)';
            } else if (nearJudge) {
                const g = ctx.createLinearGradient(x, y, x, y + h);
                g.addColorStop(0, 'rgba(255, 220, 160, 0.98)');
                g.addColorStop(1, 'rgba(232, 93, 58, 0.95)');
                ctx.fillStyle = g;
            } else if (note.playable) {
                ctx.fillStyle = 'rgba(232, 160, 120, 0.92)';
            } else {
                ctx.fillStyle = 'rgba(140, 130, 120, 0.4)';
            }
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = nearJudge ? 'rgba(255, 248, 230, 0.85)' : 'rgba(247, 243, 235, 0.5)';
            ctx.lineWidth = nearJudge ? 2 : 1;
            ctx.strokeRect(x, y, w, h);
            if (!note.isMissed && alpha > 0.4 && note.keyHint && note.keyHint !== '?') {
                drawNoteKeyLetter(x, y, w, h, note.keyHint, nearJudge, alpha);
            }
            ctx.restore();
        }

        function drawNoteKeyLetter(x, y, w, h, letter, nearJudge, alpha) {
            const fontSize = Math.max(13, Math.min(Math.floor(layout.keyWidth * 0.68), h * 0.55, 26));
            const cx = x + w / 2;
            const cy = y + h - Math.max(4, fontSize * 0.15);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `900 ${fontSize}px "Zen Kaku Gothic New", "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.strokeStyle = nearJudge ? 'rgba(191, 54, 12, 0.95)' : 'rgba(60, 45, 35, 0.9)';
            ctx.lineWidth = Math.max(2.5, fontSize * 0.14);
            ctx.lineJoin = 'round';
            ctx.strokeText(letter, cx, cy);
            ctx.fillStyle = nearJudge ? '#FFFDE7' : '#FFF8F0';
            ctx.fillText(letter, cx, cy);
            ctx.restore();
        }

        function drawEliminatingNote(note, now) {
            const elapsed = now - note.eliminateAt;
            const p = Math.min(1, elapsed / ELIMINATE_MS);
            const cx = getNoteCenterX(note.pitch);
            const w = noteW();
            const h = Math.max(10, note.duration * PIXELS_PER_SECOND);
            const scale = 1 + (note.hitPerfect ? 0.35 : 0.2) * (1 - p);
            const alpha = 1 - Math.pow(p, 0.85);
            const y = layout.judgeY - h / 2 - p * 28;
            const x = cx - (w * scale) / 2;

            drawNoteBlock(x, y, w * scale, h * scale, note, alpha, 1, true);

            if (p < 0.5) {
                ctx.save();
                ctx.globalAlpha = (0.5 - p) * 1.2;
                ctx.strokeStyle = note.hitPerfect ? '#FFD54F' : '#FFAB76';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, layout.judgeY, 12 + p * 40, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawHitBursts() {
            hitBursts = hitBursts.filter(b => {
                b.life -= 0.028;
                if (b.life <= 0) return false;
                b.y += b.vy;
                b.vy *= 0.96;
                const s = b.scale * (0.85 + b.life * 0.35);
                ctx.save();
                ctx.globalAlpha = b.life;
                ctx.textAlign = 'center';
                ctx.font = `900 ${Math.round(14 + s * 8)}px "Noto Serif JP", sans-serif`;
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 3;
                ctx.strokeText(b.text, b.x, b.y);
                ctx.fillStyle = b.color;
                ctx.fillText(b.text, b.x, b.y);
                ctx.restore();
                return true;
            });
        }

        function drawParticlesAndRings() {
            hitRings = hitRings.filter(r => {
                r.life -= 0.045;
                if (r.life <= 0) return false;
                const expand = 1 + (1 - r.life) * 2.5;
                const rad = r.radius + (r.maxRadius - r.radius) * (1 - r.life) * expand;
                ctx.save();
                ctx.globalAlpha = r.life * (r.perfect ? 0.9 : 0.7);
                ctx.strokeStyle = r.perfect ? '#FFD54F' : '#FF8A65';
                ctx.lineWidth = r.perfect ? 4 : 2.5;
                ctx.beginPath();
                ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                return true;
            });

            particles = particles.filter(pt => {
                pt.life -= pt.decay;
                if (pt.life <= 0) return false;
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.12;
                ctx.save();
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = `hsl(${pt.hue}, 90%, 62%)`;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return true;
            });
        }

        function draw() {
            const shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
            const shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 0.6 : 0;
            if (screenShake > 0) screenShake *= 0.82;

            ctx.save();
            ctx.translate(shakeX, shakeY);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#252220';
            ctx.fillRect(0, layout.pianoTop, canvas.width, canvas.height - layout.pianoTop);

            const splitX = layout.canvasLeft + 7 * layout.keyWidth;
            ctx.strokeStyle = '#4A4540';
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(splitX, 0);
            ctx.lineTo(splitX, layout.pianoTop);
            ctx.stroke();
            ctx.setLineDash([]);

            PITCH_MAP.forEach((p, i) => {
                const x = layout.canvasLeft + i * layout.keyWidth + layout.keyWidth / 2;
                ctx.strokeStyle = '#353230';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, layout.pianoTop);
                ctx.stroke();
            });

            drawJudgeLine();

            const t = getCurrentTime();
            const now = performance.now();

            if (loopEnabled && isPlaying) {
                const ls = parseFloat(document.getElementById('loopStart').value) || 0;
                const le = parseFloat(document.getElementById('loopEnd').value) || 999;
                if (t >= le) seekTo(ls);
            }

            notes.forEach(note => {
                if (!autoPlayMode && !teachMode && !note.isHit && !note.isMissed &&
                    t > note.start_time + HIT_WINDOW) {
                    registerMiss(note);
                }

                if (note.isHit && note.eliminateAt) {
                    if (now - note.eliminateAt < ELIMINATE_MS) {
                        drawEliminatingNote(note, now);
                    }
                    return;
                }
                if (note.isHit) return;

                const dist = (note.start_time - t) * PIXELS_PER_SECOND;
                const h = Math.max(10, note.duration * PIXELS_PER_SECOND);
                const y = layout.pianoTop - dist - h;
                const x = getNoteX(note.pitch);
                const w = noteW();
                if (y > canvas.height || y + h < 0) return;

                let alpha = 1;
                let scale = 1;
                const nearJudge = dist < 35 && dist > -15 && !note.isMissed;

                if (note.isMissed && note.missAt) {
                    const mp = Math.min(1, (now - note.missAt) / 500);
                    alpha = 1 - mp;
                    scale = 1 - mp * 0.4;
                    const fallY = y + mp * 40;
                    drawNoteBlock(x, fallY, w, h, note, alpha, scale, false);
                    return;
                }

                drawNoteBlock(x, y, w, h, note, alpha, scale, nearJudge);
            });

            drawParticlesAndRings();
            drawHitBursts();

            if (feedbackTimer > 0) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.font = '900 28px "Noto Serif JP", "Noto Sans TC", serif';
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.lineWidth = 4;
                ctx.strokeText(feedbackText, canvas.width / 2, layout.pianoTop - 48);
                ctx.fillStyle = feedbackColor;
                ctx.fillText(feedbackText, canvas.width / 2, layout.pianoTop - 48);
                ctx.restore();
                feedbackTimer--;
            }

            ctx.restore();
            animationId = requestAnimationFrame(draw);
        }

        function seekTo(sec) {
            if (useInternalClock) {
                clockPausedAt = sec;
                clockStart = performance.now();
            } else {
                audio.currentTime = sec + AUDIO_OFFSET;
            }
            notes.forEach(n => {
                if (n.start_time >= sec - 0.01) {
                    n.isHit = false;
                    n.isMissed = false;
                    delete n.eliminateAt;
                    delete n.missAt;
                    delete n.hitPerfect;
                }
            });
            resetFx();
        }

        function clearModes() {
            teachMode = false;
            autoPlayMode = false;
            teachTimeouts.forEach(clearTimeout);
            autoTimeouts.forEach(clearTimeout);
            teachTimeouts = [];
            autoTimeouts = [];
            clearKeyHighlights();
            document.getElementById('btnTeach').classList.remove('active-mode');
            document.getElementById('btnAuto').classList.remove('active-mode');
            document.getElementById('btnPlay').classList.remove('active-mode');
        }

        function beginPlayback(fromSec) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = true;
            if (useInternalClock) {
                clockPausedAt = fromSec || 0;
                clockStart = performance.now();
            } else {
                audio.currentTime = (fromSec || 0) + AUDIO_OFFSET;
                audio.playbackRate = getSpeed();
                audio.play().catch(() => {});
            }
            if (!animationId) draw();
        }

        function syncSpeedSelects() {
            const v = document.getElementById('speedSel').value;
            const dock = document.getElementById('speedSelDock');
            if (dock) dock.value = v;
        }

        function setSpeedFrom(sel) {
            document.getElementById('speedSel').value = sel.value;
            setSpeed();
        }

        function updatePlayButtonLabels() {
            const playing = isPlaying;
            const playLabel = playing ? '⏸ 暫停' : '▶ 開始跟彈';
            const bp = document.getElementById('btnPlay');
            if (bp) {
                bp.textContent = playing ? '暫停' : '跟彈';
                bp.classList.toggle('active-mode', playing);
            }
            const dock = document.getElementById('btnPlayDock');
            if (dock) {
                dock.textContent = playLabel;
                dock.classList.toggle('active-mode', playing);
            }
        }

        let countdownRunning = false;
        function startWithCountdown(onGo) {
            if (countdownRunning) return;
            const overlay = document.getElementById('countdownOverlay');
            const numEl = document.getElementById('countdownNum');
            if (!overlay || !numEl || !(isTouchProfile() && isLandscapeView())) {
                onGo();
                return;
            }
            countdownRunning = true;
            let n = 3;
            numEl.textContent = String(n);
            overlay.classList.add('show');
            const step = () => {
                n -= 1;
                if (n > 0) {
                    numEl.textContent = String(n);
                    setTimeout(step, 650);
                } else {
                    overlay.classList.remove('show');
                    countdownRunning = false;
                    onGo();
                }
            };
            setTimeout(step, 650);
        }

        function togglePlay() {
            clearModes();
            if (isPlaying) {
                isPlaying = false;
                if (!useInternalClock) audio.pause();
                else clockPausedAt = getCurrentTime();
                cancelAnimationFrame(animationId);
                animationId = null;
                updatePlayButtonLabels();
                return;
            }
            const fromStart = getCurrentTime() < 0.05;
            const go = () => {
                document.getElementById('btnPlay').classList.add('active-mode');
                beginPlayback(fromStart ? 0 : getCurrentTime());
                updatePlayButtonLabels();
            };
            if (fromStart && isTouchProfile() && isLandscapeView()) {
                startWithCountdown(go);
            } else {
                go();
            }
        }

        function setSpeed() {
            if (!useInternalClock) audio.playbackRate = getSpeed();
            syncSpeedSelects();
        }

        function restart() {
            clearModes();
            isPlaying = false;
            if (!useInternalClock) { audio.pause(); audio.currentTime = AUDIO_OFFSET; }
            clockPausedAt = 0;
            notes = initNotes(rawScoreData);
            stats = { hits: 0, mistakes: 0, combo: 0, maxCombo: 0 };
            resetFx();
            updateStatsUI();
            draw();
            cancelAnimationFrame(animationId);
            animationId = null;
            updatePlayButtonLabels();
        }

        function toggleLoop() { loopEnabled = !loopEnabled; }

        function applyChorusLoop() {
            if (PRACTICE_MODE === 'chorus') {
                document.getElementById('loopStart').value = 0;
                const dur = notes.length
                    ? Math.max(...notes.map(n => n.start_time + n.duration)) + 0.5
                    : 30;
                document.getElementById('loopEnd').value = Math.ceil(dur);
            } else {
                document.getElementById('loopStart').value = CHORUS_START;
                document.getElementById('loopEnd').value = CHORUS_END;
            }
            loopEnabled = true;
            showFeedback('副歌區間', '#B8C4B0');
        }

        function scheduleNotes(mode) {
            const speed = getSpeed();
            notes.forEach(note => {
                if (!note.playable) return;
                const pk = pitchToKey[note.pitch];
                const delay = (note.start_time * 1000) / speed;
                const id = setTimeout(() => {
                    highlightKey(pk.key, mode);
                    playSynth(note.pitch, Math.min(note.duration, 0.55));
                    setTimeout(() => highlightKey(pk.key, null), note.duration * 1000 / speed);
                }, delay);
                (mode === 'auto' ? autoTimeouts : teachTimeouts).push(id);
            });
        }

        function startTeachMode() {
            restart();
            teachMode = true;
            document.getElementById('btnTeach').classList.add('active-mode');
            beginPlayback(0);
            scheduleNotes('teach');
            const maxT = notes.length ? Math.max(...notes.map(n => n.start_time + n.duration)) + 1 : 8;
            teachTimeouts.push(setTimeout(() => {
                isPlaying = false;
                teachMode = false;
                if (!useInternalClock) audio.pause();
                showFeedback('おしまい', '#C9B8A4');
            }, maxT * 1100 / getSpeed()));
        }

        function startAutoPlay() {
            restart();
            autoPlayMode = true;
            document.getElementById('btnAuto').classList.add('active-mode');
            beginPlayback(0);
            scheduleNotes('auto');
            const maxT = notes.length ? Math.max(...notes.map(n => n.start_time + n.duration)) + 1 : 8;
            autoTimeouts.push(setTimeout(() => {
                isPlaying = false;
                autoPlayMode = false;
                if (!useInternalClock) audio.pause();
                showFeedback('自動演奏終', '#C9B8A4');
            }, maxT * 1100 / getSpeed()));
        }

        if (notes.length) {
            const last = notes[notes.length - 1];
            const dur = last.start_time + last.duration + 1;
            document.getElementById('loopEnd').value = Math.ceil(dur);
            if (PRACTICE_MODE === 'chorus') {
                document.getElementById('loopStart').value = 0;
                document.getElementById('loopEnd').value = Math.ceil(dur);
                loopEnabled = true;
            } else if (CHORUS_END > CHORUS_START) {
                document.getElementById('loopStart').value = CHORUS_START;
                document.getElementById('loopEnd').value = CHORUS_END;
            }
        }

        applyLayout();
        window.addEventListener('resize', applyLayout);
        window.addEventListener('orientationchange', () => setTimeout(applyLayout, 120));
        if (screen.orientation && screen.orientation.addEventListener) {
            screen.orientation.addEventListener('change', () => setTimeout(applyLayout, 120));
        }
        if (window.visualViewport) {
            visualViewport.addEventListener('resize', applyLayout);
            visualViewport.addEventListener('scroll', applyLayout);
        }

        updateStatsUI();
        draw();
        cancelAnimationFrame(animationId);
        animationId = null;

        if (AUTO_PLAY_ON_LOAD) {
            setTimeout(() => startAutoPlay(), 600);
        }
    </script>
</body>
</html>
