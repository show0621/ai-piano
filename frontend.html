<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{{SONG_TITLE}} - AI 鋼琴教學</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0d0d12; color: #eee; font-family: "Segoe UI", sans-serif;
            margin: 0; padding: 12px; text-align: center;
        }
        h3 { margin: 0 0 8px; font-weight: 600; }
        #gameCanvas {
            background: #000; border: 2px solid #333; border-radius: 8px;
            max-width: 100%; display: block; margin: 0 auto; width: 100%;
        }
        .controls {
            margin-top: 10px; display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px; align-items: center;
        }
        button, select {
            padding: 8px 14px; font-size: 14px; cursor: pointer;
            background: #2563eb; color: white; border: none; border-radius: 6px;
        }
        button.secondary { background: #374151; }
        button.active-mode { background: #059669; }
        .keyboard-hint { margin-top: 8px; color: #9ca3af; font-size: 13px; }
        .octave-label {
            margin: 10px 0 4px; font-size: 12px; color: #64748b;
            letter-spacing: 0.05em;
        }
        .piano-wrap {
            display: flex; justify-content: center; margin-top: 4px; gap: 2px;
            flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px;
        }
        .p-key {
            width: 36px; min-width: 36px; height: 88px; background: #f8fafc; color: #111;
            border: 1px solid #94a3b8; border-radius: 0 0 6px 6px;
            display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; padding-bottom: 6px; font-size: 11px;
            font-weight: bold; transition: background 0.08s, transform 0.08s;
            user-select: none;
        }
        .p-key.active { background: #fca5a5; transform: translateY(2px); }
        .p-key.teach { background: #86efac; }
        .p-key .kn { font-size: 18px; color: #2563eb; }
        .stats-bar {
            display: flex; justify-content: center; gap: 20px;
            margin-top: 8px; font-size: 14px; color: #cbd5e1;
        }
        audio { display: none; }
        label { font-size: 13px; color: #9ca3af; }
    </style>
</head>
<body>

    <h3>🎹 {{SONG_TITLE}}</h3>

    <canvas id="gameCanvas" width="1100" height="440"></canvas>

    <div class="stats-bar">
        <span id="statCombo">Combo: 0</span>
        <span id="statAcc">命中率: --</span>
        <span id="statMiss">Miss: 0</span>
    </div>

    <div class="controls">
        <audio id="bgm" preload="auto"></audio>
        <button id="btnPlay" onclick="togglePlay()">▶ 跟彈模式</button>
        <button id="btnTeach" class="secondary" onclick="startTeachMode()">👀 观摩教學</button>
        <button class="secondary" onclick="restart()">⏮ 重來</button>
        <label>速度</label>
        <select id="speedSel" onchange="setSpeed()">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
        </select>
        <label>練習段落</label>
        <input type="number" id="loopStart" value="0" step="0.5" style="width:60px" title="起點秒">
        <span>–</span>
        <input type="number" id="loopEnd" value="10" step="0.5" style="width:60px" title="終點秒">
        <button class="secondary" onclick="toggleLoop()">🔁 A-B 循環</button>
        <button class="secondary" onclick="copyMistakes()">📋 複製失誤 JSON</button>
    </div>

    <p class="keyboard-hint">
        <b>下排八度 C4–B4</b>：A S D F G H J &nbsp;|&nbsp;
        <b>上排八度 C5–B5</b>：Q W E R T Y U
    </p>

    <p class="octave-label">▼ 八度 1 · C4 – B4</p>
    <div class="piano-wrap" id="piano-low"></div>
    <p class="octave-label">▼ 八度 2 · C5 – B5</p>
    <div class="piano-wrap" id="piano-high"></div>

    <script>
        const rawScoreData = {{SCORE_JSON_PLACEHOLDER}};
        const AUDIO_SRC = "{{AUDIO_SRC_PLACEHOLDER}}";

        // 雙八度白鍵：C4–B4（下排）、C5–B5（上排）
        const PITCH_MAP = [
            { pitch: 60, key: 'a', label: 'C4', kn: 'A', octave: 1 },
            { pitch: 62, key: 's', label: 'D4', kn: 'S', octave: 1 },
            { pitch: 64, key: 'd', label: 'E4', kn: 'D', octave: 1 },
            { pitch: 65, key: 'f', label: 'F4', kn: 'F', octave: 1 },
            { pitch: 67, key: 'g', label: 'G4', kn: 'G', octave: 1 },
            { pitch: 69, key: 'h', label: 'A4', kn: 'H', octave: 1 },
            { pitch: 71, key: 'j', label: 'B4', kn: 'J', octave: 1 },
            { pitch: 72, key: 'q', label: 'C5', kn: 'Q', octave: 2 },
            { pitch: 74, key: 'w', label: 'D5', kn: 'W', octave: 2 },
            { pitch: 76, key: 'e', label: 'E5', kn: 'E', octave: 2 },
            { pitch: 77, key: 'r', label: 'F5', kn: 'R', octave: 2 },
            { pitch: 79, key: 't', label: 'G5', kn: 'T', octave: 2 },
            { pitch: 81, key: 'y', label: 'A5', kn: 'Y', octave: 2 },
            { pitch: 83, key: 'u', label: 'B5', kn: 'U', octave: 2 },
        ];
        const PITCH_MIN = 60;
        const PITCH_MAX = 83;
        const pitchToKey = Object.fromEntries(PITCH_MAP.map(p => [p.pitch, p]));
        const keyToPitch = Object.fromEntries(PITCH_MAP.map(p => [p.key, p.pitch]));

        let notes = JSON.parse(JSON.stringify(rawScoreData || []));
        notes.forEach(n => {
            n.isHit = false;
            n.isMissed = false;
            const pk = pitchToKey[n.pitch];
            n.keyHint = pk ? pk.kn : '?';
            n.playable = !!pk;
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgm');
        if (AUDIO_SRC) audio.src = AUDIO_SRC;

        const PIXELS_PER_SECOND = 130;
        const HIT_LINE_Y = canvas.height - 8;
        const KEY_WIDTH = 36;
        const HIT_WINDOW = 0.2;
        const PIANO_TOP = canvas.height - 58;
        const CANVAS_LEFT = 50;

        let animationId = null;
        let stats = { hits: 0, mistakes: 0, combo: 0 };
        let feedbackText = '', feedbackColor = '#fff', feedbackTimer = 0;
        let mistakeLog = [];
        let teachMode = false;
        let teachTimeouts = [];
        let loopEnabled = false;
        let useInternalClock = !AUDIO_SRC;
        let clockStart = 0;
        let clockPausedAt = 0;
        let isPlaying = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const keyEls = {};

        // 建立雙八度虛擬琴鍵 UI
        const pianoLow = document.getElementById('piano-low');
        const pianoHigh = document.getElementById('piano-high');
        PITCH_MAP.forEach(p => {
            const el = document.createElement('div');
            el.className = 'p-key';
            el.id = 'pk-' + p.key;
            el.innerHTML = `<span class="kn">${p.kn}</span><span>${p.label}</span>`;
            el.onclick = () => onKeyPress(p.key, true);
            (p.octave === 1 ? pianoLow : pianoHigh).appendChild(el);
            keyEls[p.key] = el;
        });

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function playSynth(midi, dur = 0.35) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = midiToFreq(midi);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function highlightKey(key, cls) {
            const el = keyEls[key];
            if (!el) return;
            el.classList.remove('active', 'teach');
            if (cls) el.classList.add(cls);
        }

        function clearKeyHighlights() {
            Object.values(keyEls).forEach(el => el.classList.remove('active', 'teach'));
        }

        function getCurrentTime() {
            if (useInternalClock) {
                if (!isPlaying) return clockPausedAt;
                return clockPausedAt + (performance.now() - clockStart) / 1000 * parseFloat(document.getElementById('speedSel').value);
            }
            return audio.currentTime;
        }

        function getNoteX(pitch) {
            const idx = PITCH_MAP.findIndex(p => p.pitch === pitch);
            if (idx >= 0) return CANVAS_LEFT + idx * KEY_WIDTH;
            // 黑鍵或範圍外：依半音位置插值
            const clamped = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
            const semitone = clamped - PITCH_MIN;
            return CANVAS_LEFT + semitone * (KEY_WIDTH * 0.58);
        }

        function updateStatsUI() {
            const total = stats.hits + stats.mistakes;
            const acc = total ? Math.round((stats.hits / total) * 100) : 100;
            document.getElementById('statCombo').textContent = 'Combo: ' + stats.combo;
            document.getElementById('statAcc').textContent = '命中率: ' + acc + '%';
            document.getElementById('statMiss').textContent = 'Miss: ' + stats.mistakes;
        }

        function showFeedback(text, color) {
            feedbackText = text;
            feedbackColor = color;
            feedbackTimer = 35;
        }

        function onKeyPress(key, fromClick) {
            const pitch = keyToPitch[key];
            if (!pitch) return;
            highlightKey(key, 'active');
            playSynth(pitch, 0.25);
            setTimeout(() => highlightKey(key, null), 120);

            if (teachMode || !isPlaying) return;

            const t = getCurrentTime();
            const hit = notes.find(n => {
                if (n.pitch !== pitch || n.isHit || n.isMissed || !n.playable) return false;
                return Math.abs(n.start_time - t) <= HIT_WINDOW;
            });

            if (hit) {
                hit.isHit = true;
                stats.hits++;
                stats.combo++;
                const diff = Math.abs(hit.start_time - t);
                showFeedback(diff < 0.08 ? 'Perfect!' : 'Good', '#4ade80');
            } else {
                stats.combo = 0;
            }
            updateStatsUI();
        }

        window.addEventListener('keydown', e => {
            if (e.repeat) return;
            const k = e.key.toLowerCase();
            if (keyToPitch[k]) { e.preventDefault(); onKeyPress(k, false); }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 琴鍵區背景
            ctx.fillStyle = '#1a1a22';
            ctx.fillRect(0, PIANO_TOP, canvas.width, canvas.height - PIANO_TOP);

            // 判定線
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, PIANO_TOP);
            ctx.lineTo(canvas.width, PIANO_TOP);
            ctx.stroke();

            // 八度分隔線
            const splitX = CANVAS_LEFT + 7 * KEY_WIDTH;
            ctx.strokeStyle = '#475569';
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(splitX, 0);
            ctx.lineTo(splitX, PIANO_TOP);
            ctx.stroke();
            ctx.setLineDash([]);

            // 鍵位導引線
            PITCH_MAP.forEach((p, i) => {
                const x = CANVAS_LEFT + i * KEY_WIDTH + KEY_WIDTH / 2;
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, PIANO_TOP);
                ctx.stroke();
            });

            const t = getCurrentTime();

            // A-B 循環
            if (loopEnabled && isPlaying) {
                const ls = parseFloat(document.getElementById('loopStart').value) || 0;
                const le = parseFloat(document.getElementById('loopEnd').value) || 999;
                if (t >= le) {
                    seekTo(ls);
                }
            }

            notes.forEach(note => {
                if (!note.isHit && !note.isMissed && t > note.start_time + HIT_WINDOW) {
                    note.isMissed = true;
                    stats.mistakes++;
                    stats.combo = 0;
                    mistakeLog.push({ pitch: note.pitch, start_time: note.start_time, key: note.keyHint });
                    showFeedback('Miss', '#f87171');
                    updateStatsUI();
                }
                if (note.isHit) return;

                const dist = (note.start_time - t) * PIXELS_PER_SECOND;
                const h = Math.max(12, note.duration * PIXELS_PER_SECOND);
                const y = PIANO_TOP - dist - h;
                const x = getNoteX(note.pitch);

                if (y > canvas.height || y + h < 0) return;

                ctx.fillStyle = note.isMissed ? 'rgba(80,80,80,0.4)'
                    : note.playable ? 'rgba(34,211,238,0.9)' : 'rgba(150,150,150,0.5)';
                ctx.fillRect(x, y, KEY_WIDTH - 6, h);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, KEY_WIDTH - 6, h);

                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(note.keyHint, x + 10, y + h - 6);
            });

            if (feedbackTimer > 0) {
                ctx.fillStyle = feedbackColor;
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(feedbackText, canvas.width / 2 - 60, PIANO_TOP - 40);
                feedbackTimer--;
            }

            animationId = requestAnimationFrame(draw);
        }

        function seekTo(sec) {
            if (useInternalClock) {
                clockPausedAt = sec;
                clockStart = performance.now();
            } else {
                audio.currentTime = sec;
            }
            notes.forEach(n => {
                if (n.start_time >= sec - 0.01 && n.start_time < sec + 30) {
                    n.isHit = false;
                    n.isMissed = false;
                }
            });
        }

        function togglePlay() {
            teachMode = false;
            clearTeach();
            document.getElementById('btnTeach').classList.remove('active-mode');
            document.getElementById('btnPlay').classList.add('active-mode');

            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                isPlaying = false;
                if (!useInternalClock) audio.pause();
                else clockPausedAt = getCurrentTime();
                cancelAnimationFrame(animationId);
                animationId = null;
            } else {
                isPlaying = true;
                if (useInternalClock) {
                    clockStart = performance.now();
                } else {
                    audio.playbackRate = parseFloat(document.getElementById('speedSel').value);
                    audio.play().catch(() => alert('無法播放音檔，將使用無伴奏模式'));
                }
                if (!animationId) draw();
            }
        }

        function setSpeed() {
            const rate = parseFloat(document.getElementById('speedSel').value);
            if (!useInternalClock) audio.playbackRate = rate;
        }

        function restart() {
            isPlaying = false;
            teachMode = false;
            clearTeach();
            if (!useInternalClock) {
                audio.pause();
                audio.currentTime = 0;
            }
            clockPausedAt = 0;
            notes = JSON.parse(JSON.stringify(rawScoreData));
            notes.forEach(n => {
                n.isHit = false; n.isMissed = false;
                const pk = pitchToKey[n.pitch];
                n.keyHint = pk ? pk.kn : '?';
                n.playable = !!pk;
            });
            stats = { hits: 0, mistakes: 0, combo: 0 };
            mistakeLog = [];
            updateStatsUI();
            draw();
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        function toggleLoop() {
            loopEnabled = !loopEnabled;
        }

        function clearTeach() {
            teachTimeouts.forEach(id => clearTimeout(id));
            teachTimeouts = [];
            clearKeyHighlights();
        }

        function startTeachMode() {
            restart();
            teachMode = true;
            isPlaying = true;
            document.getElementById('btnTeach').classList.add('active-mode');
            document.getElementById('btnPlay').classList.remove('active-mode');

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const maxTime = notes.length
                ? Math.max(...notes.map(n => n.start_time + n.duration)) + 1
                : 8;

            if (!useInternalClock) {
                audio.currentTime = 0;
                audio.playbackRate = parseFloat(document.getElementById('speedSel').value);
                audio.play();
            } else {
                clockPausedAt = 0;
                clockStart = performance.now();
            }

            notes.forEach(note => {
                if (!note.playable) return;
                const pk = pitchToKey[note.pitch];
                const delay = note.start_time * 1000;
                const id = setTimeout(() => {
                    highlightKey(pk.key, 'teach');
                    playSynth(note.pitch, Math.min(note.duration, 0.6));
                    setTimeout(() => highlightKey(pk.key, null), note.duration * 1000);
                }, delay / parseFloat(document.getElementById('speedSel').value));
                teachTimeouts.push(id);
            });

            const endId = setTimeout(() => {
                isPlaying = false;
                teachMode = false;
                if (!useInternalClock) audio.pause();
                showFeedback('教學結束', '#a78bfa');
            }, maxTime * 1100);
            teachTimeouts.push(endId);

            if (!animationId) draw();
        }

        function copyMistakes() {
            const text = JSON.stringify(mistakeLog, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                alert('已複製 ' + mistakeLog.length + ' 筆失誤到剪貼簿，可貼到 Streamlit 側欄分析。');
            }).catch(() => prompt('複製以下 JSON：', text));
        }

        // 依樂譜自動設定練習段落
        if (notes.length) {
            const last = notes[notes.length - 1];
            document.getElementById('loopEnd').value = Math.ceil(last.start_time + last.duration + 1);
        }

        updateStatsUI();
        draw();
        cancelAnimationFrame(animationId);
        animationId = null;
    </script>
</body>
</html>
