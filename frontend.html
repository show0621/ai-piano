<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{SONG_TITLE}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --key-w: 34px;
            --key-h: 84px;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            padding: 12px 8px 16px;
            text-align: center;
            font-family: 'Zen Kaku Gothic New', 'Noto Sans TC', sans-serif;
            color: #4A4035;
            background: linear-gradient(180deg, #F7F3EB 0%, #EDE8DF 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .game-shell {
            max-width: 1200px;
            margin: 0 auto;
        }
        .game-header { margin-bottom: 6px; }
        h3 {
            margin: 0 0 4px;
            font-family: 'Noto Serif JP', 'Noto Serif TC', serif;
            font-weight: 400;
            letter-spacing: 0.18em;
            font-size: 1.1rem;
            color: #3D3530;
        }
        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: #8B7355;
            margin-bottom: 12px;
        }
        .canvas-wrap {
            position: relative;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 1100px;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            background: #2C2824;
            border: 1px solid #C9B8A4;
            border-radius: 2px;
            box-shadow: 0 8px 32px rgba(74, 64, 53, 0.12);
        }
        #rotateHint {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(165deg, #2C2824, #4A4035);
            color: #F7F3EB;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px;
            font-family: 'Noto Serif JP', serif;
            letter-spacing: 0.12em;
        }
        #rotateHint.show { display: flex; }
        #rotateHint .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            animation: tiltPhone 1.2s ease-in-out infinite;
        }
        @keyframes tiltPhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        #comboOverlay {
            position: absolute;
            right: 6%;
            top: 32%;
            pointer-events: none;
            text-align: right;
            z-index: 5;
        }
        #comboNumber {
            font-family: 'Noto Serif JP', 'Noto Sans TC', serif;
            font-size: 3.6rem;
            font-weight: 700;
            line-height: 1;
            color: #E85D3A;
            text-shadow:
                0 0 12px rgba(255, 120, 60, 0.9),
                0 2px 0 #8B3A22,
                0 4px 8px rgba(0, 0, 0, 0.45);
            transform: scale(1);
            opacity: 0;
            transition: opacity 0.15s;
        }
        #comboNumber.visible { opacity: 1; }
        #comboNumber.bump {
            animation: comboBump 0.22s cubic-bezier(0.2, 1.4, 0.4, 1);
        }
        #comboNumber.mega {
            color: #FFD54F;
            font-size: 4.4rem;
            text-shadow:
                0 0 20px rgba(255, 215, 0, 1),
                0 0 40px rgba(255, 100, 50, 0.6),
                0 3px 0 #B8860B;
        }
        #comboNumber.ultra {
            color: #FFF8E7;
            font-size: 5rem;
            animation: comboUltra 0.35s ease-out;
        }
        #comboNumber.fire {
            color: #FF5722;
            font-size: 4rem;
            animation: comboFire 0.28s ease-out infinite;
            text-shadow:
                0 0 18px rgba(255, 87, 34, 1),
                0 0 36px rgba(255, 200, 0, 0.7),
                0 3px 0 #BF360C;
        }
        #comboNumber.inferno {
            color: #FFEB3B;
            font-size: 5.2rem;
            animation: comboInferno 0.22s ease-in-out infinite;
            text-shadow:
                0 0 24px #FF5722,
                0 0 48px #FFD54F,
                0 0 72px rgba(255, 100, 0, 0.5),
                0 4px 0 #E65100;
        }
        @keyframes comboFire {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.08) rotate(2deg); }
        }
        @keyframes comboInferno {
            0% { transform: scale(1.15) rotate(-3deg); filter: brightness(1.3); }
            50% { transform: scale(1.25) rotate(3deg); filter: brightness(1.6); }
            100% { transform: scale(1.1) rotate(-2deg); filter: brightness(1.2); }
        }
        #comboLabel {
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            color: #F7C59F;
            margin-top: 2px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        #comboLabel.visible { opacity: 1; }
        #judgmentPop {
            position: absolute;
            left: 50%;
            top: 58%;
            transform: translate(-50%, -50%) scale(0.3);
            pointer-events: none;
            font-family: 'Noto Serif JP', serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            opacity: 0;
            z-index: 6;
            white-space: nowrap;
        }
        #judgmentPop.show {
            animation: judgmentPop 0.45s cubic-bezier(0.15, 1.2, 0.3, 1) forwards;
        }
        #judgmentPop.good { color: #A8D5BA; text-shadow: 0 0 10px rgba(168, 213, 186, 0.8); }
        #rapidBanner {
            position: absolute;
            left: 50%;
            top: 18%;
            transform: translateX(-50%) scale(0.4);
            pointer-events: none;
            font-family: 'Noto Serif JP', 'Noto Sans TC', serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: #FF3D00;
            letter-spacing: 0.06em;
            opacity: 0;
            z-index: 7;
            white-space: nowrap;
            text-shadow:
                0 0 16px #FF6D00,
                0 0 32px rgba(255, 214, 0, 0.9),
                0 3px 0 #BF360C,
                2px 2px 0 rgba(0, 0, 0, 0.35);
        }
        #rapidBanner.show {
            animation: rapidBanner 0.65s cubic-bezier(0.15, 1.45, 0.25, 1) forwards;
        }
        #judgmentPop.perfect {
            color: #FFEB3B;
            text-shadow:
                0 0 20px #FF9800,
                0 0 40px rgba(255, 235, 59, 0.8),
                0 2px 0 #E65100;
        }
        #screenFlash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.35) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            border-radius: 2px;
        }
        #screenFlash.on {
            animation: screenFlash 0.25s ease-out forwards;
        }
        @keyframes comboBump {
            0% { transform: scale(2.2) rotate(-4deg); }
            55% { transform: scale(0.92) rotate(2deg); }
            100% { transform: scale(1) rotate(0); }
        }
        @keyframes comboUltra {
            0% { transform: scale(2.8); filter: brightness(2); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        @keyframes judgmentPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            35% { opacity: 1; transform: translate(-50%, -58%) scale(1.35); }
            70% { opacity: 1; transform: translate(-50%, -62%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -72%) scale(0.85); }
        }
        @keyframes rapidBanner {
            0% { opacity: 0; transform: translateX(-50%) scale(0.35) rotate(-12deg); }
            18% { opacity: 1; transform: translateX(-50%) scale(1.45) rotate(4deg); }
            45% { opacity: 1; transform: translateX(-50%) scale(1.2) rotate(-2deg); }
            100% { opacity: 0; transform: translateX(-50%) scale(1.3) translateY(-28px) rotate(6deg); }
        }
        @keyframes screenFlash {
            0% { opacity: 0.7; }
            100% { opacity: 0; }
        }
        #statCombo.hot { color: #E85D3A; font-weight: 600; }
        .stats-bar {
            display: flex; justify-content: center; gap: 24px;
            margin: 10px 0; font-size: 0.85rem;
            color: #6B5E52; letter-spacing: 0.06em;
        }
        .controls {
            margin-top: 12px;
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px; align-items: center;
        }
        button, select, input[type="number"] {
            font-family: inherit;
            padding: 8px 14px;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            border-radius: 2px;
            border: 1px solid #C9B8A4;
            background: #F7F3EB;
            color: #4A4035;
        }
        button.primary {
            background: #8B7355;
            color: #F7F3EB;
            border-color: #8B7355;
        }
        button.active-mode {
            background: #A8B5A0;
            color: #2C3828;
            border-color: #8A9A86;
        }
        button.secondary { background: #EFEBE3; }
        .keyboard-hint {
            margin-top: 10px;
            font-size: 0.72rem;
            color: #8B7355;
            letter-spacing: 0.08em;
            line-height: 1.6;
        }
        .octave-label {
            margin: 12px 0 4px;
            font-size: 0.68rem;
            color: #A89888;
            letter-spacing: 0.2em;
            font-family: 'Noto Serif JP', serif;
        }
        .piano-wrap {
            display: flex; justify-content: center;
            gap: 2px; overflow-x: auto; padding-bottom: 4px;
        }
        .piano-section { width: 100%; max-width: 1100px; margin: 0 auto; }
        .p-key {
            width: var(--key-w);
            min-width: var(--key-w);
            height: var(--key-h);
            background: #FAF8F4;
            color: #4A4035;
            border: 1px solid #D4C9B8;
            border-radius: 0 0 4px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 6px;
            font-size: 0.65rem;
            transition: background 0.08s, transform 0.06s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
        .touch-hint { display: none; margin-top: 8px; }
        .touch-device .keyboard-hint-desktop { display: none; }
        .touch-device .touch-hint { display: block; }
        /* 平板橫向 / 手機橫向：雙排鍵併排、大觸控區 */
        @media (max-width: 1024px) and (orientation: landscape) {
            body { padding: 4px 2px 6px; }
            .game-header h3 { font-size: 0.9rem; letter-spacing: 0.1em; }
            .game-header .subtitle { font-size: 0.65rem; margin-bottom: 4px; }
            .stats-bar { font-size: 0.72rem; gap: 14px; margin: 4px 0; }
            .controls {
                gap: 6px;
                margin-top: 6px;
            }
            .controls button, .controls select {
                min-height: 44px;
                padding: 8px 12px;
                font-size: 0.78rem;
            }
            .octave-label { display: none; }
            .piano-section {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: stretch;
                gap: 8px;
                padding: 0 2px;
            }
            .piano-wrap {
                flex: 1;
                min-width: 0;
                max-width: 50%;
            }
            #comboNumber { font-size: 2.2rem; }
            #comboNumber.mega { font-size: 2.8rem; }
            #judgmentPop { font-size: 1.6rem; }
        }
        /* 手機直向：提示橫放 */
        @media (max-width: 768px) and (orientation: portrait) {
            body.mode-mobile-portrait .game-shell {
                opacity: 0.35;
                pointer-events: none;
            }
        }
        /* 電腦寬螢幕 */
        @media (min-width: 1025px) {
            body { padding: 16px 12px 24px; }
            .piano-section .piano-rows { display: block; }
        }
        .p-key.active { background: #D4A59A; transform: translateY(2px); }
        .p-key.teach { background: #B8C4B0; }
        .p-key.auto { background: #C9B8A4; }
        .p-key .kn {
            font-size: 1rem;
            color: #8B7355;
            font-family: 'Noto Serif JP', serif;
        }
        label { font-size: 0.75rem; color: #8B7355; }
        audio { display: none; }
    </style>
</head>
<body>

    <div id="rotateHint">
        <div class="icon">📱↻</div>
        <p><strong>請將裝置橫放</strong></p>
        <p style="font-size:0.85rem;opacity:0.85;margin-top:8px;">橫向模式可完整顯示音符與琴鍵，方便觸控彈奏</p>
    </div>

    <div class="game-shell">
    <header class="game-header">
        <h3>{{SONG_TITLE}}</h3>
        <p class="subtitle" id="modeLabel">練習模式</p>
    </header>

    <div class="canvas-wrap">
        <canvas id="gameCanvas" width="1100" height="420"></canvas>
        <div id="screenFlash"></div>
        <div id="comboOverlay">
            <div id="comboNumber">0</div>
            <div id="comboLabel">COMBO</div>
        </div>
        <div id="judgmentPop"></div>
        <div id="rapidBanner"></div>
    </div>

    <div class="stats-bar">
        <span id="statCombo">連擊 0</span>
        <span id="statAcc">正確率 —</span>
        <span id="statMiss">漏接 0</span>
    </div>

    <div class="controls">
        <audio id="bgm" preload="auto"></audio>
        <button id="btnPlay" class="primary" onclick="togglePlay()">跟彈</button>
        <button id="btnAuto" class="secondary" onclick="startAutoPlay()">自動彈奏</button>
        <button id="btnTeach" class="secondary" onclick="startTeachMode()">观摩教學</button>
        <button class="secondary" onclick="restart()">重來</button>
        <label>速度</label>
        <select id="speedSel" onchange="setSpeed()">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1.0×</option>
        </select>
        <label>A–B</label>
        <input type="number" id="loopStart" value="0" step="0.5" style="width:52px">
        <span>–</span>
        <input type="number" id="loopEnd" value="10" step="0.5" style="width:52px">
        <button class="secondary" onclick="toggleLoop()">循環</button>
        <button class="secondary" onclick="applyChorusLoop()">副歌區間</button>
    </div>

    <p class="keyboard-hint keyboard-hint-desktop">
        電腦鍵盤 — 下排 C4–B4：<b>A S D F G H J</b>　｜　上排 C5–B5：<b>Q W E R T Y U</b>
    </p>
    <p class="keyboard-hint touch-hint">👆 點擊下方琴鍵彈奏（建議橫放裝置）</p>

    <section class="piano-section">
        <div class="piano-rows">
            <p class="octave-label">一 · C4–B4</p>
            <div class="piano-wrap" id="piano-low"></div>
            <p class="octave-label">二 · C5–B5</p>
            <div class="piano-wrap" id="piano-high"></div>
        </div>
    </section>
    </div><!-- .game-shell -->

    <script>
        const rawScoreData = {{SCORE_JSON_PLACEHOLDER}};
        const AUDIO_SRC = "{{AUDIO_SRC_PLACEHOLDER}}";
        const CHORUS_START = {{CHORUS_START}};
        const CHORUS_END = {{CHORUS_END}};
        const AUDIO_OFFSET = {{AUDIO_OFFSET}};
        const PRACTICE_MODE = "{{PRACTICE_MODE}}";
        const AUTO_PLAY_ON_LOAD = {{AUTO_PLAY}};

        const PITCH_MAP = [
            { pitch: 60, key: 'a', label: 'C4', kn: 'A', octave: 1 },
            { pitch: 62, key: 's', label: 'D4', kn: 'S', octave: 1 },
            { pitch: 64, key: 'd', label: 'E4', kn: 'D', octave: 1 },
            { pitch: 65, key: 'f', label: 'F4', kn: 'F', octave: 1 },
            { pitch: 67, key: 'g', label: 'G4', kn: 'G', octave: 1 },
            { pitch: 69, key: 'h', label: 'A4', kn: 'H', octave: 1 },
            { pitch: 71, key: 'j', label: 'B4', kn: 'J', octave: 1 },
            { pitch: 72, key: 'q', label: 'C5', kn: 'Q', octave: 2 },
            { pitch: 74, key: 'w', label: 'D5', kn: 'W', octave: 2 },
            { pitch: 76, key: 'e', label: 'E5', kn: 'E', octave: 2 },
            { pitch: 77, key: 'r', label: 'F5', kn: 'R', octave: 2 },
            { pitch: 79, key: 't', label: 'G5', kn: 'T', octave: 2 },
            { pitch: 81, key: 'y', label: 'A5', kn: 'Y', octave: 2 },
            { pitch: 83, key: 'u', label: 'B5', kn: 'U', octave: 2 },
        ];
        const PITCH_MIN = 60, PITCH_MAX = 83;
        const pitchToKey = Object.fromEntries(PITCH_MAP.map(p => [p.pitch, p]));
        const keyToPitch = Object.fromEntries(PITCH_MAP.map(p => [p.key, p.pitch]));

        function initNotes(data) {
            const arr = JSON.parse(JSON.stringify(data || []));
            arr.forEach(n => {
                n.isHit = false;
                n.isMissed = false;
                const pk = pitchToKey[n.pitch];
                n.keyHint = pk ? pk.kn : '?';
                n.playable = !!pk;
            });
            return arr;
        }

        let notes = initNotes(rawScoreData);
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgm');
        if (AUDIO_SRC) audio.src = AUDIO_SRC;

        const PIXELS_PER_SECOND = 125;
        const PERFECT_WINDOW = 0.06;
        const HIT_WINDOW = 0.2;
        const ELIMINATE_MS = 380;
        let layout = {
            canvasW: 1100, canvasH: 420,
            keyWidth: 34, canvasLeft: 48,
            pianoTop: 366, judgeY: 362,
        };

        function isMobileView() {
            return window.matchMedia('(max-width: 1024px)').matches;
        }
        function isLandscapeView() {
            return window.matchMedia('(orientation: landscape)').matches;
        }
        function noteW() { return layout.keyWidth - 5; }

        function applyLayout() {
            const wrap = document.querySelector('.canvas-wrap');
            const availW = wrap ? Math.max(280, wrap.clientWidth) : Math.min(1100, window.innerWidth - 16);
            const mobile = isMobileView();
            const land = isLandscapeView();
            let w, h, keyW;

            if (mobile && land) {
                w = Math.floor(Math.min(availW, window.innerWidth - 4));
                h = Math.floor(Math.max(180, Math.min(window.innerHeight * 0.4, 420)));
                keyW = Math.max(26, Math.floor((w - 36) / 14));
                document.body.classList.add('mode-mobile-land');
                document.body.classList.remove('mode-mobile-portrait');
            } else if (mobile) {
                w = Math.floor(Math.min(availW, 900));
                h = Math.floor(Math.max(160, Math.min(w * 0.38, 320)));
                keyW = Math.max(22, Math.floor((w - 28) / 14));
                document.body.classList.add('mode-mobile-portrait');
                document.body.classList.remove('mode-mobile-land');
            } else {
                w = Math.floor(Math.min(1100, availW));
                h = Math.round(w * 420 / 1100);
                keyW = Math.max(30, Math.floor((w - 56) / 14));
                document.body.classList.remove('mode-mobile-portrait', 'mode-mobile-land');
            }

            const left = Math.max(20, Math.floor((w - keyW * 14) / 2));
            const pianoTop = h - Math.max(44, Math.round(h * 0.128));
            layout = {
                canvasW: w, canvasH: h,
                keyWidth: keyW, canvasLeft: left,
                pianoTop, judgeY: pianoTop - 4,
            };

            canvas.width = w;
            canvas.height = h;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            let keyH = 84;
            if (mobile && land) keyH = Math.min(90, Math.max(66, window.innerHeight * 0.13));
            else if (mobile) keyH = 64;
            document.documentElement.style.setProperty('--key-w', keyW + 'px');
            document.documentElement.style.setProperty('--key-h', Math.round(keyH) + 'px');

            const rh = document.getElementById('rotateHint');
            if (rh) rh.classList.toggle('show', mobile && !land);
        }
        const RAPID_WINDOW_MS = 520;

        let animationId = null;
        let stats = { hits: 0, mistakes: 0, combo: 0, maxCombo: 0 };
        let feedbackText = '', feedbackColor = '#E8DED0', feedbackTimer = 0;
        let teachMode = false, autoPlayMode = false;
        let teachTimeouts = [], autoTimeouts = [];
        let loopEnabled = PRACTICE_MODE === 'chorus';
        let useInternalClock = !AUDIO_SRC;
        let clockStart = 0, clockPausedAt = 0, isPlaying = false;
        let screenShake = 0;
        let particles = [];
        let hitRings = [];
        let hitBursts = [];
        let recentHitTimes = [];
        let lastRapidBannerAt = 0;

        const comboEl = document.getElementById('comboNumber');
        const comboLabelEl = document.getElementById('comboLabel');
        const judgmentEl = document.getElementById('judgmentPop');
        const rapidBannerEl = document.getElementById('rapidBanner');
        const screenFlashEl = document.getElementById('screenFlash');
        const statComboEl = document.getElementById('statCombo');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const keyEls = {};

        document.getElementById('modeLabel').textContent =
            PRACTICE_MODE === 'chorus' ? '副歌練習 · サビ' : '整首練習 · フル';

        const pianoLow = document.getElementById('piano-low');
        const pianoHigh = document.getElementById('piano-high');
        function bindPianoKey(el, key) {
            const tap = (e) => {
                if (e.cancelable) e.preventDefault();
                onKeyPress(key);
            };
            el.addEventListener('click', tap);
            el.addEventListener('touchstart', tap, { passive: false });
        }

        PITCH_MAP.forEach(p => {
            const el = document.createElement('div');
            el.className = 'p-key';
            el.id = 'pk-' + p.key;
            el.innerHTML = `<span class="kn">${p.kn}</span><span>${p.label}</span>`;
            bindPianoKey(el, p.key);
            (p.octave === 1 ? pianoLow : pianoHigh).appendChild(el);
            keyEls[p.key] = el;
        });

        if ('ontouchstart' in window) document.body.classList.add('touch-device');

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function playSynth(midi, dur = 0.35) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = midiToFreq(midi);
            gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function highlightKey(key, cls) {
            const el = keyEls[key];
            if (!el) return;
            el.classList.remove('active', 'teach', 'auto');
            if (cls) el.classList.add(cls);
        }

        function clearKeyHighlights() {
            Object.values(keyEls).forEach(el => el.classList.remove('active', 'teach', 'auto'));
        }

        function getSpeed() {
            return parseFloat(document.getElementById('speedSel').value);
        }

        function getCurrentTime() {
            if (useInternalClock) {
                if (!isPlaying) return clockPausedAt;
                return clockPausedAt + (performance.now() - clockStart) / 1000 * getSpeed();
            }
            return audio.currentTime - AUDIO_OFFSET;
        }

        function getNoteX(pitch) {
            const idx = PITCH_MAP.findIndex(p => p.pitch === pitch);
            if (idx >= 0) return layout.canvasLeft + idx * layout.keyWidth;
            const clamped = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
            return layout.canvasLeft + (clamped - PITCH_MIN) * (layout.keyWidth * 0.58);
        }

        function updateStatsUI() {
            const total = stats.hits + stats.mistakes;
            const acc = total ? Math.round((stats.hits / total) * 100) : 100;
            statComboEl.textContent = '連擊 ' + stats.combo;
            statComboEl.classList.toggle('hot', stats.combo >= 10);
            document.getElementById('statAcc').textContent = '正確率 ' + acc + '%';
            document.getElementById('statMiss').textContent = '漏接 ' + stats.mistakes;
        }

        function showFeedback(text, color) {
            feedbackText = text;
            feedbackColor = color;
            feedbackTimer = 35;
        }

        function getNoteCenterX(pitch) {
            return getNoteX(pitch) + noteW() / 2;
        }

        function spawnParticles(cx, cy, perfect, count) {
            const n = count || (perfect ? 22 : 14);
            const baseHue = perfect ? 42 : 18;
            for (let i = 0; i < n; i++) {
                const angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
                const speed = (perfect ? 4.5 : 3) + Math.random() * 3.5;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.2,
                    life: 1,
                    decay: 0.028 + Math.random() * 0.02,
                    size: perfect ? 5 + Math.random() * 4 : 3 + Math.random() * 3,
                    hue: baseHue + Math.random() * 20,
                });
            }
        }

        function spawnHitRing(cx, cy, perfect, combo) {
            const boost = Math.min((combo || 1) * 0.04, 0.35);
            hitRings.push({
                x: cx, y: cy,
                radius: perfect ? 8 : 6,
                maxRadius: (perfect ? 52 : 38) * (1 + boost),
                life: 1,
                perfect,
            });
        }

        function spawnHitBurst(cx, cy, combo) {
            if (combo < 2) return;
            let text = '+';
            let color = '#FFE082';
            if (combo >= 20) {
                text = combo + ' 連擊!!';
                color = '#FFEB3B';
            } else if (combo >= 10) {
                text = combo + ' COMBO';
                color = '#FFAB40';
            } else if (combo >= 5) {
                text = combo + ' 連!';
                color = '#FF8A65';
            }
            hitBursts.push({
                x: cx, y: cy - 24,
                text, color,
                life: 1,
                vy: -2.8,
                scale: 1 + Math.min(combo, 40) * 0.015,
            });
        }

        function flashScreen(intensity) {
            screenFlashEl.style.opacity = String(intensity || 0.5);
            screenFlashEl.classList.remove('on');
            void screenFlashEl.offsetWidth;
            screenFlashEl.classList.add('on');
        }

        function showJudgment(kind) {
            const text = kind === 'perfect' ? '可' : kind === 'good' ? '良' : '不可';
            judgmentEl.textContent = text;
            judgmentEl.className = kind === 'perfect' ? 'perfect' : kind === 'good' ? 'good' : '';
            judgmentEl.classList.remove('show');
            void judgmentEl.offsetWidth;
            judgmentEl.classList.add('show');
        }

        function showRapidBanner(count) {
            const now = performance.now();
            if (now - lastRapidBannerAt < 320) return;
            lastRapidBannerAt = now;
            rapidBannerEl.textContent = count + ' 連擊！！';
            rapidBannerEl.classList.remove('show');
            void rapidBannerEl.offsetWidth;
            rapidBannerEl.classList.add('show');
            flashScreen(Math.min(0.35 + count * 0.05, 0.75));
            screenShake = Math.min(8 + count * 1.8, 18);
        }

        function updateComboDisplay(combo) {
            if (combo < 2) {
                comboEl.classList.remove('visible', 'bump', 'mega', 'ultra', 'fire', 'inferno');
                comboLabelEl.classList.remove('visible');
                return;
            }
            comboEl.textContent = combo;
            comboEl.classList.add('visible');
            comboLabelEl.classList.add('visible');
            comboLabelEl.textContent =
                combo >= 50 ? '🔥 超神連擊' :
                combo >= 30 ? '🔥 無雙' :
                combo >= 20 ? '大連擊' :
                combo >= 10 ? '連擊中!' :
                combo >= 5 ? 'COMBO' : 'COMBO';

            comboEl.classList.remove('bump', 'mega', 'ultra', 'fire', 'inferno');
            void comboEl.offsetWidth;
            comboEl.classList.add('bump');
            if (combo >= 50) comboEl.classList.add('ultra', 'inferno');
            else if (combo >= 30) comboEl.classList.add('inferno');
            else if (combo >= 20) comboEl.classList.add('mega', 'fire');
            else if (combo >= 15) comboEl.classList.add('fire');
            else if (combo >= 10) comboEl.classList.add('mega');
        }

        function resetFx() {
            particles = [];
            hitRings = [];
            hitBursts = [];
            recentHitTimes = [];
            screenShake = 0;
            comboEl.classList.remove('visible', 'bump', 'mega', 'ultra');
            comboLabelEl.classList.remove('visible');
            judgmentEl.classList.remove('show');
            rapidBannerEl.classList.remove('show');
        }

        function registerHit(note, delta) {
            const perfect = delta <= PERFECT_WINDOW;
            const cx = getNoteCenterX(note.pitch);
            const now = performance.now();

            note.isHit = true;
            note.eliminateAt = now;
            note.hitPerfect = perfect;

            stats.hits++;
            stats.combo++;
            if (stats.combo > stats.maxCombo) stats.maxCombo = stats.combo;

            const comboNow = stats.combo;
            const particleN = perfect
                ? 18 + Math.min(comboNow * 2, 28)
                : 12 + Math.min(comboNow, 16);
            spawnParticles(cx, layout.judgeY, perfect, particleN);
            spawnHitRing(cx, layout.judgeY, perfect, comboNow);
            spawnHitBurst(cx, layout.judgeY, comboNow);
            showJudgment(perfect ? 'perfect' : 'good');
            updateComboDisplay(comboNow);

            const shake = (perfect ? 4 : 2) + Math.min(comboNow * 0.45, 14);
            screenShake = Math.max(screenShake, shake);
            flashScreen(0.18 + Math.min(comboNow * 0.018, 0.35));

            if (comboNow % 10 === 0 && comboNow >= 10) {
                flashScreen(0.65);
                screenShake = Math.max(screenShake, 14);
                showFeedback(comboNow + ' 連擊！！', '#FFEB3B');
                spawnParticles(cx, layout.judgeY, true, 36);
            } else if (comboNow % 5 === 0 && comboNow >= 5) {
                flashScreen(0.4);
                showFeedback('火力全開!', '#FFAB40');
            }

            recentHitTimes.push(now);
            recentHitTimes = recentHitTimes.filter(t => now - t < RAPID_WINDOW_MS);
            if (recentHitTimes.length >= 3) {
                showRapidBanner(recentHitTimes.length);
            }
        }

        function registerMiss(note) {
            note.isMissed = true;
            note.missAt = performance.now();
            stats.mistakes++;
            stats.combo = 0;
            recentHitTimes = [];
            updateComboDisplay(0);
            showJudgment('miss');
            showFeedback('漏接', '#A08078');
            updateStatsUI();
        }

        function onKeyPress(key) {
            const pitch = keyToPitch[key];
            if (!pitch) return;
            highlightKey(key, 'active');
            playSynth(pitch, 0.25);
            setTimeout(() => highlightKey(key, null), 100);
            if (teachMode || autoPlayMode || !isPlaying) return;

            const t = getCurrentTime();
            const candidates = notes.filter(n =>
                n.pitch === pitch && !n.isHit && !n.isMissed && n.playable &&
                Math.abs(n.start_time - t) <= HIT_WINDOW
            );
            if (!candidates.length) {
                stats.combo = 0;
                updateComboDisplay(0);
                updateStatsUI();
                return;
            }
            const hit = candidates.reduce((best, n) =>
                Math.abs(n.start_time - t) < Math.abs(best.start_time - t) ? n : best
            );
            const delta = Math.abs(hit.start_time - t);
            registerHit(hit, delta);
            updateStatsUI();
        }

        window.addEventListener('keydown', e => {
            if (e.repeat) return;
            const k = e.key.toLowerCase();
            if (keyToPitch[k]) { e.preventDefault(); onKeyPress(k); }
        });

        function drawJudgeLine() {
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
            const grad = ctx.createLinearGradient(0, layout.judgeY - 20, 0, layout.judgeY + 20);
            grad.addColorStop(0, 'rgba(255, 180, 100, 0)');
            grad.addColorStop(0.5, `rgba(255, 200, 120, ${0.25 + pulse * 0.15})`);
            grad.addColorStop(1, 'rgba(255, 180, 100, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, layout.judgeY - 18, canvas.width, 36);

            ctx.strokeStyle = `rgba(255, 213, 140, ${0.55 + pulse * 0.25})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(layout.canvasLeft, layout.judgeY);
            ctx.lineTo(layout.canvasLeft + PITCH_MAP.length * layout.keyWidth, layout.judgeY);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(layout.canvasLeft, layout.judgeY + 2);
            ctx.lineTo(layout.canvasLeft + PITCH_MAP.length * layout.keyWidth, layout.judgeY + 2);
            ctx.stroke();
        }

        function drawNoteBlock(x, y, w, h, note, alpha, scale, nearJudge) {
            const cx = x + w / 2;
            const cy = y + h / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.translate(-cx, -cy);
            ctx.globalAlpha = alpha;

            if (note.isMissed) {
                ctx.fillStyle = 'rgba(90, 82, 78, 0.45)';
            } else if (nearJudge) {
                const g = ctx.createLinearGradient(x, y, x, y + h);
                g.addColorStop(0, 'rgba(255, 220, 160, 0.98)');
                g.addColorStop(1, 'rgba(232, 93, 58, 0.95)');
                ctx.fillStyle = g;
            } else if (note.playable) {
                ctx.fillStyle = 'rgba(232, 160, 120, 0.92)';
            } else {
                ctx.fillStyle = 'rgba(140, 130, 120, 0.4)';
            }
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = nearJudge ? 'rgba(255, 248, 230, 0.85)' : 'rgba(247, 243, 235, 0.5)';
            ctx.lineWidth = nearJudge ? 2 : 1;
            ctx.strokeRect(x, y, w, h);
            if (!note.isMissed && alpha > 0.4 && note.keyHint && note.keyHint !== '?') {
                drawNoteKeyLetter(x, y, w, h, note.keyHint, nearJudge, alpha);
            }
            ctx.restore();
        }

        function drawNoteKeyLetter(x, y, w, h, letter, nearJudge, alpha) {
            const fontSize = Math.max(13, Math.min(Math.floor(layout.keyWidth * 0.68), h * 0.55, 26));
            const cx = x + w / 2;
            const cy = y + h - Math.max(4, fontSize * 0.15);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `900 ${fontSize}px "Zen Kaku Gothic New", "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.strokeStyle = nearJudge ? 'rgba(191, 54, 12, 0.95)' : 'rgba(60, 45, 35, 0.9)';
            ctx.lineWidth = Math.max(2.5, fontSize * 0.14);
            ctx.lineJoin = 'round';
            ctx.strokeText(letter, cx, cy);
            ctx.fillStyle = nearJudge ? '#FFFDE7' : '#FFF8F0';
            ctx.fillText(letter, cx, cy);
            ctx.restore();
        }

        function drawEliminatingNote(note, now) {
            const elapsed = now - note.eliminateAt;
            const p = Math.min(1, elapsed / ELIMINATE_MS);
            const cx = getNoteCenterX(note.pitch);
            const w = noteW();
            const h = Math.max(10, note.duration * PIXELS_PER_SECOND);
            const scale = 1 + (note.hitPerfect ? 0.35 : 0.2) * (1 - p);
            const alpha = 1 - Math.pow(p, 0.85);
            const y = layout.judgeY - h / 2 - p * 28;
            const x = cx - (w * scale) / 2;

            drawNoteBlock(x, y, w * scale, h * scale, note, alpha, 1, true);

            if (p < 0.5) {
                ctx.save();
                ctx.globalAlpha = (0.5 - p) * 1.2;
                ctx.strokeStyle = note.hitPerfect ? '#FFD54F' : '#FFAB76';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, layout.judgeY, 12 + p * 40, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawHitBursts() {
            hitBursts = hitBursts.filter(b => {
                b.life -= 0.028;
                if (b.life <= 0) return false;
                b.y += b.vy;
                b.vy *= 0.96;
                const s = b.scale * (0.85 + b.life * 0.35);
                ctx.save();
                ctx.globalAlpha = b.life;
                ctx.textAlign = 'center';
                ctx.font = `900 ${Math.round(14 + s * 8)}px "Noto Serif JP", sans-serif`;
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 3;
                ctx.strokeText(b.text, b.x, b.y);
                ctx.fillStyle = b.color;
                ctx.fillText(b.text, b.x, b.y);
                ctx.restore();
                return true;
            });
        }

        function drawParticlesAndRings() {
            hitRings = hitRings.filter(r => {
                r.life -= 0.045;
                if (r.life <= 0) return false;
                const expand = 1 + (1 - r.life) * 2.5;
                const rad = r.radius + (r.maxRadius - r.radius) * (1 - r.life) * expand;
                ctx.save();
                ctx.globalAlpha = r.life * (r.perfect ? 0.9 : 0.7);
                ctx.strokeStyle = r.perfect ? '#FFD54F' : '#FF8A65';
                ctx.lineWidth = r.perfect ? 4 : 2.5;
                ctx.beginPath();
                ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                return true;
            });

            particles = particles.filter(pt => {
                pt.life -= pt.decay;
                if (pt.life <= 0) return false;
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.12;
                ctx.save();
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = `hsl(${pt.hue}, 90%, 62%)`;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return true;
            });
        }

        function draw() {
            const shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
            const shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 0.6 : 0;
            if (screenShake > 0) screenShake *= 0.82;

            ctx.save();
            ctx.translate(shakeX, shakeY);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#252220';
            ctx.fillRect(0, layout.pianoTop, canvas.width, canvas.height - layout.pianoTop);

            const splitX = layout.canvasLeft + 7 * layout.keyWidth;
            ctx.strokeStyle = '#4A4540';
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(splitX, 0);
            ctx.lineTo(splitX, layout.pianoTop);
            ctx.stroke();
            ctx.setLineDash([]);

            PITCH_MAP.forEach((p, i) => {
                const x = layout.canvasLeft + i * layout.keyWidth + layout.keyWidth / 2;
                ctx.strokeStyle = '#353230';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, layout.pianoTop);
                ctx.stroke();
            });

            drawJudgeLine();

            const t = getCurrentTime();
            const now = performance.now();

            if (loopEnabled && isPlaying) {
                const ls = parseFloat(document.getElementById('loopStart').value) || 0;
                const le = parseFloat(document.getElementById('loopEnd').value) || 999;
                if (t >= le) seekTo(ls);
            }

            notes.forEach(note => {
                if (!autoPlayMode && !teachMode && !note.isHit && !note.isMissed &&
                    t > note.start_time + HIT_WINDOW) {
                    registerMiss(note);
                }

                if (note.isHit && note.eliminateAt) {
                    if (now - note.eliminateAt < ELIMINATE_MS) {
                        drawEliminatingNote(note, now);
                    }
                    return;
                }
                if (note.isHit) return;

                const dist = (note.start_time - t) * PIXELS_PER_SECOND;
                const h = Math.max(10, note.duration * PIXELS_PER_SECOND);
                const y = layout.pianoTop - dist - h;
                const x = getNoteX(note.pitch);
                const w = noteW();
                if (y > canvas.height || y + h < 0) return;

                let alpha = 1;
                let scale = 1;
                const nearJudge = dist < 35 && dist > -15 && !note.isMissed;

                if (note.isMissed && note.missAt) {
                    const mp = Math.min(1, (now - note.missAt) / 500);
                    alpha = 1 - mp;
                    scale = 1 - mp * 0.4;
                    const fallY = y + mp * 40;
                    drawNoteBlock(x, fallY, w, h, note, alpha, scale, false);
                    return;
                }

                drawNoteBlock(x, y, w, h, note, alpha, scale, nearJudge);
            });

            drawParticlesAndRings();
            drawHitBursts();

            if (feedbackTimer > 0) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.font = '900 28px "Noto Serif JP", "Noto Sans TC", serif';
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.lineWidth = 4;
                ctx.strokeText(feedbackText, canvas.width / 2, layout.pianoTop - 48);
                ctx.fillStyle = feedbackColor;
                ctx.fillText(feedbackText, canvas.width / 2, layout.pianoTop - 48);
                ctx.restore();
                feedbackTimer--;
            }

            ctx.restore();
            animationId = requestAnimationFrame(draw);
        }

        function seekTo(sec) {
            if (useInternalClock) {
                clockPausedAt = sec;
                clockStart = performance.now();
            } else {
                audio.currentTime = sec + AUDIO_OFFSET;
            }
            notes.forEach(n => {
                if (n.start_time >= sec - 0.01) {
                    n.isHit = false;
                    n.isMissed = false;
                    delete n.eliminateAt;
                    delete n.missAt;
                    delete n.hitPerfect;
                }
            });
            resetFx();
        }

        function clearModes() {
            teachMode = false;
            autoPlayMode = false;
            teachTimeouts.forEach(clearTimeout);
            autoTimeouts.forEach(clearTimeout);
            teachTimeouts = [];
            autoTimeouts = [];
            clearKeyHighlights();
            document.getElementById('btnTeach').classList.remove('active-mode');
            document.getElementById('btnAuto').classList.remove('active-mode');
            document.getElementById('btnPlay').classList.remove('active-mode');
        }

        function beginPlayback(fromSec) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = true;
            if (useInternalClock) {
                clockPausedAt = fromSec || 0;
                clockStart = performance.now();
            } else {
                audio.currentTime = (fromSec || 0) + AUDIO_OFFSET;
                audio.playbackRate = getSpeed();
                audio.play().catch(() => {});
            }
            if (!animationId) draw();
        }

        function togglePlay() {
            clearModes();
            document.getElementById('btnPlay').classList.add('active-mode');
            if (isPlaying) {
                isPlaying = false;
                if (!useInternalClock) audio.pause();
                else clockPausedAt = getCurrentTime();
                cancelAnimationFrame(animationId);
                animationId = null;
            } else {
                beginPlayback(getCurrentTime());
            }
        }

        function setSpeed() {
            if (!useInternalClock) audio.playbackRate = getSpeed();
        }

        function restart() {
            clearModes();
            isPlaying = false;
            if (!useInternalClock) { audio.pause(); audio.currentTime = AUDIO_OFFSET; }
            clockPausedAt = 0;
            notes = initNotes(rawScoreData);
            stats = { hits: 0, mistakes: 0, combo: 0, maxCombo: 0 };
            resetFx();
            updateStatsUI();
            draw();
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        function toggleLoop() { loopEnabled = !loopEnabled; }

        function applyChorusLoop() {
            if (PRACTICE_MODE === 'chorus') {
                document.getElementById('loopStart').value = 0;
                const dur = notes.length
                    ? Math.max(...notes.map(n => n.start_time + n.duration)) + 0.5
                    : 30;
                document.getElementById('loopEnd').value = Math.ceil(dur);
            } else {
                document.getElementById('loopStart').value = CHORUS_START;
                document.getElementById('loopEnd').value = CHORUS_END;
            }
            loopEnabled = true;
            showFeedback('副歌區間', '#B8C4B0');
        }

        function scheduleNotes(mode) {
            const speed = getSpeed();
            notes.forEach(note => {
                if (!note.playable) return;
                const pk = pitchToKey[note.pitch];
                const delay = (note.start_time * 1000) / speed;
                const id = setTimeout(() => {
                    highlightKey(pk.key, mode);
                    playSynth(note.pitch, Math.min(note.duration, 0.55));
                    setTimeout(() => highlightKey(pk.key, null), note.duration * 1000 / speed);
                }, delay);
                (mode === 'auto' ? autoTimeouts : teachTimeouts).push(id);
            });
        }

        function startTeachMode() {
            restart();
            teachMode = true;
            document.getElementById('btnTeach').classList.add('active-mode');
            beginPlayback(0);
            scheduleNotes('teach');
            const maxT = notes.length ? Math.max(...notes.map(n => n.start_time + n.duration)) + 1 : 8;
            teachTimeouts.push(setTimeout(() => {
                isPlaying = false;
                teachMode = false;
                if (!useInternalClock) audio.pause();
                showFeedback('おしまい', '#C9B8A4');
            }, maxT * 1100 / getSpeed()));
        }

        function startAutoPlay() {
            restart();
            autoPlayMode = true;
            document.getElementById('btnAuto').classList.add('active-mode');
            beginPlayback(0);
            scheduleNotes('auto');
            const maxT = notes.length ? Math.max(...notes.map(n => n.start_time + n.duration)) + 1 : 8;
            autoTimeouts.push(setTimeout(() => {
                isPlaying = false;
                autoPlayMode = false;
                if (!useInternalClock) audio.pause();
                showFeedback('自動演奏終', '#C9B8A4');
            }, maxT * 1100 / getSpeed()));
        }

        if (notes.length) {
            const last = notes[notes.length - 1];
            const dur = last.start_time + last.duration + 1;
            document.getElementById('loopEnd').value = Math.ceil(dur);
            if (PRACTICE_MODE === 'chorus') {
                document.getElementById('loopStart').value = 0;
                document.getElementById('loopEnd').value = Math.ceil(dur);
                loopEnabled = true;
            } else if (CHORUS_END > CHORUS_START) {
                document.getElementById('loopStart').value = CHORUS_START;
                document.getElementById('loopEnd').value = CHORUS_END;
            }
        }

        applyLayout();
        window.addEventListener('resize', applyLayout);
        window.addEventListener('orientationchange', () => setTimeout(applyLayout, 280));

        updateStatsUI();
        draw();
        cancelAnimationFrame(animationId);
        animationId = null;

        if (AUTO_PLAY_ON_LOAD) {
            setTimeout(() => startAutoPlay(), 600);
        }
    </script>
</body>
</html>
