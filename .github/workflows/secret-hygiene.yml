# 防止金鑰被誤提交到 GitHub（金鑰應放在 Streamlit Cloud Secrets 或 GitHub Actions Secrets）
name: Secret hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block committed local secrets file
        shell: bash
        run: |
          if [ -f .streamlit/secrets.toml ]; then
            echo "::error::.streamlit/secrets.toml 不可提交到 GitHub，請刪除並改用 Streamlit Cloud Secrets"
            exit 1
          fi
          if [ -f .env ]; then
            echo "::error::.env 不可提交到 GitHub"
            exit 1
          fi

      - name: Scan for obvious credential patterns in tracked files
        shell: bash
        run: |
          if git grep -nE 'client_secret\s*=\s*"[a-zA-Z0-9]{16,}"' -- '*.py' '*.toml' '*.md' ':!.env.example' ':!secrets.toml.example' 2>/dev/null; then
            echo "::error::疑似將 client_secret 寫死在程式碼中"
            exit 1
          fi
          echo "No obvious hardcoded secrets found."
